<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planete-Computers 2.0 · PC2 Diag</title>
<style>
/* Layout : fenêtre d'atelier façon HWiNFO — barre d'outils, arborescence à gauche, panneau de détail à droite, barre d'état avec capteurs */
:root{
  --bg:#F3F4F6; --panel:#ffffff; --side:#f7f8f9; --fg:#18222b; --muted:#5d6a75; --faint:#8a96a0; --line:#d6dde2; --row:#f4f6f8;
  --accent:#2A3FF5; --accent-fg:#ffffff; --sel:#e1e5fe; --brand-2:#63D7CA; --navy:#141D3A; --term:#0f171d; --term-fg:#cfe3e6;
  --crit:#b42318; --crit-bg:#fde8e6; --warn:#9a5800; --warn-bg:#fdf1dc; --info:#2459a6; --info-bg:#e5eefb; --ok:#1d7a46; --ok-bg:#e2f4ea;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --f-disp:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; --f-mono:"Cascadia Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1022; --panel:#141D3A; --side:#111933; --fg:#e6e9f2; --muted:#9aa3bd; --faint:#6d779a; --line:#27345e; --row:#1a2547;
  --accent:#63D7CA; --accent-fg:#141D3A; --sel:#1c3550; --term:#0b1115; --term-fg:#bfe0e4;
  --crit:#ff8a7f; --crit-bg:#3a1c1a; --warn:#f2b45c; --warn-bg:#36290f; --info:#8db6f5; --info-bg:#1a2a42; --ok:#6fd39b; --ok-bg:#15301f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.45 var(--f-ui);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* barre d'outils */
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);border-top:3px solid;border-image:linear-gradient(90deg,#2A3FF5,#63D7CA) 1}
.brand{display:flex;align-items:center;gap:8px;font:600 14px var(--f-disp);margin-right:14px;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--accent)}
.brand small{display:block;font:500 11px var(--f-ui);color:var(--muted)}
.tb{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--row);border-color:var(--line)}
.tb.primary{background:var(--accent);color:var(--accent-fg)}
.tb.primary:hover{filter:brightness(1.08)}
.tb.on{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:600}
.tb:disabled{opacity:.5;cursor:default}
.tb svg{width:16px;height:16px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.pill{font:600 11px var(--f-ui);border-radius:999px;padding:2px 8px;background:var(--ok-bg);color:var(--ok)}
.pill.limited{background:var(--warn-bg);color:var(--warn)}

/* corps */
.main{display:grid;grid-template-columns:270px 1fr;min-height:0}
.tree{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.node{display:flex;align-items:center;gap:7px;padding:4px 10px 4px calc(10px + var(--d,0)*16px);cursor:pointer;white-space:nowrap;border-left:3px solid transparent}
.node:hover{background:var(--row)}
.node.sel{background:var(--accent);border-left-color:var(--navy);color:var(--accent-fg);font-weight:600}
.node.sel svg,.node.sel .tw{color:var(--accent-fg)}
.node.sel:hover{background:var(--accent)}
.node svg{width:15px;height:15px;flex:none;color:var(--muted)}
.node .tw{width:12px;flex:none;color:var(--faint);font-size:10px;text-align:center}
.node .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.node .cnt{font:600 11px var(--f-mono);border-radius:999px;padding:0 6px}
.cnt.crit{background:var(--crit-bg);color:var(--crit)} .cnt.warn{background:var(--warn-bg);color:var(--warn)} .cnt.info{background:var(--info-bg);color:var(--info)} .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)} .dot.ok{background:var(--ok)}
.sect{padding:10px 12px 3px;font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

.content{overflow:auto;padding:18px 22px 28px;min-width:0;user-select:text}
.main > .content, .main > #atelier{grid-column:2;grid-row:1;min-height:0}
#atelier{border:0;width:100%;height:100%;background:var(--bg)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font:600 21px/1.2 var(--f-disp);margin:0}
.ph .sub{color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:12px}

/* tableau de propriétés façon HWiNFO */
.props{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.props td{padding:5px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.props tr:last-child td{border-bottom:0}
.props td:first-child{width:38%;color:var(--muted)}
.props td:last-child{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.props tr.grp td{background:var(--row);color:var(--accent);font:600 11px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;padding:6px 12px}
.props .st{display:inline-flex;align-items:center;gap:6px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.meter{display:inline-block;width:120px;height:6px;background:var(--row);border:1px solid var(--line);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)} .meter i.w{background:var(--warn)} .meter i.c{background:var(--crit)}

/* constats */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.f{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;padding:11px 14px;display:grid;gap:6px}
.f.crit{--sev:var(--crit)} .f.warn{--sev:var(--warn)} .f.info{--sev:var(--info)}
.f .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.f .sev{font:700 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--sev);white-space:nowrap}
.f h3{margin:0;font-size:14px;flex:1;min-width:200px}
.f .cat{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.f .where{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.f .fix{max-width:90ch}
.f .fix ol,.f .fix ul{margin:3px 0 0;padding-left:20px}
.f .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f code{font-family:var(--f-mono);font-size:12px;background:var(--row);border-radius:4px;padding:1px 5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.go:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}

/* résumé */
.sum{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:1150px){.sum{grid-template-columns:1fr}}
.score{display:flex;gap:18px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring text{font:700 26px var(--f-disp);fill:var(--fg)}
.verdict h2{margin:0 0 4px;font:600 17px var(--f-disp)}
.verdict p{margin:0;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cattile{border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:var(--panel);display:grid;gap:2px}
.cattile:hover{border-color:var(--accent)}
.cattile b{display:flex;align-items:center;gap:7px;font-size:13px}
.cattile span{font-size:12px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini .m{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.mini .m .k{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.mini .m .k b{font:600 13px var(--f-mono);color:var(--fg)}
.mini canvas{width:100%;height:42px;display:block;margin-top:4px}
.progress{height:8px;background:var(--row);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scanning{display:grid;gap:8px}
.scanning .lbl{display:flex;justify-content:space-between;color:var(--muted)}

/* capteurs */
.sens{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sens th{position:sticky;top:-18px;background:var(--row);text-align:right;font:600 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);z-index:1}
.sens th:first-child,.sens td:first-child{text-align:left}
.sens td{padding:3px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.sens td:first-child{font-family:var(--f-ui);font-size:13px}
.sens tr.g td{background:var(--row);color:var(--accent);font:600 11.5px var(--f-ui);text-align:left;padding:5px 10px}
.sens tr.s{cursor:pointer}
.sens tr.s:hover td{background:var(--row)}
.sens tr.s.sel td{background:var(--sel)}
.sens td.spark{width:130px;padding:2px 10px}
.sens canvas{width:120px;height:20px;display:block}
.big{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.big .hd{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.big .hd b{color:var(--fg);font:600 15px var(--f-mono)}
.big canvas{width:100%;height:150px;display:block;margin-top:6px}

/* réparations */
.agrp{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:8px 0 -4px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.act.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--sel)}
.act .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.act h3{margin:0;font-size:14px;flex:1;min-width:220px}
.act .meta{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--row);color:var(--muted)}
.tag.reboot{background:var(--warn-bg);color:var(--warn)}
.act .risk{font-size:12.5px;color:var(--warn)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--row);border-radius:6px;padding:8px 10px}
.term{background:var(--term);color:var(--term-fg);font:12px/1.45 var(--f-mono);border-radius:6px;padding:8px 10px;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.run{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res{font-weight:600} .res.ok{color:var(--ok)} .res.ko{color:var(--crit)}

/* formulaire */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form label.check{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;margin-bottom:6px}
.invchk{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0;cursor:pointer}
.form select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.form input,.form textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.form textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:13px}

table.list{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
table.list th{text-align:left;background:var(--row);font:600 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:-18px}
table.list td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.search{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:320px;max-width:100%}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px}

/* tests manuels */
.tsts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tst{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.tst.ok{border-left-color:var(--ok)} .tst.ko{border-left-color:var(--crit)} .tst.na{border-left-color:var(--faint)}
.tst-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tst-tip{color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--row);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:none;font:700 11.5px var(--f-ui);padding:3px 9px;border-radius:5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"][data-tv="ok"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-tv="ko"]{background:var(--crit);color:#fff}
.seg button[aria-pressed="true"][data-tv="na"]{background:var(--faint);color:#fff}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(10,16,34,.55);display:flex;align-items:center;justify-content:center;padding:20px;user-select:none}
.ovl.bare{background:#000;cursor:pointer}
.ovl-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#888;font-size:13px;transition:opacity .3s}
.ovl-box{background:var(--panel);color:var(--fg);border-radius:12px;padding:18px 20px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ovl-box.wide{max-width:1000px}
.ovl-box h2{margin:0 0 6px;font:600 18px var(--f-disp)}
.ovl-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.kb{display:grid;gap:5px;margin-top:10px}
.kbr{display:flex;gap:5px}
.kbk{flex:1;min-width:0;text-align:center;border:1px solid var(--line);border-radius:6px;padding:9px 2px;font-size:12px;background:var(--row);white-space:nowrap;overflow:hidden}
.kbk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.k-Space{flex:6} .k-Backspace,.k-Enter,.k-ShiftLeft,.k-ShiftRight,.k-CapsLock,.k-Tab{flex:1.8}
.pad{height:260px;border:2px dashed var(--line);border-radius:10px;margin-top:10px;cursor:crosshair}
.pad canvas{width:100%;height:100%;display:block}
.pad-c{margin-top:8px;font-size:13px}
.ovl video{width:100%;max-height:340px;background:#000;border-radius:8px;margin-top:6px}
.mic{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
/* barre d'état */
.status{display:flex;align-items:center;gap:18px;padding:4px 12px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status b{font:600 12px var(--f-mono);color:var(--fg)}
.status .msg{flex:1;overflow:hidden;text-overflow:ellipsis}
/* espace disque */
.du-drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.du-drive{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:grid;gap:5px}
.du-drive b{font-size:13.5px}
.du-drive .meter{width:100%;margin:0;height:8px}
.du-drive span{font-size:12px;color:var(--muted)}
.du-drive .btn{justify-self:start}
.du-path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.du-cur{font:12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du-nums{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 6px;font-size:12.5px;color:var(--muted)}
.du-nums b{font:600 15px var(--f-mono);color:var(--fg);display:block}
.du-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.du-tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.du-crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font:12.5px var(--f-mono)}
.du-crumbs button{border:0;background:none;padding:2px 4px;border-radius:4px;cursor:pointer;color:var(--accent)}
.du-crumbs button:hover{background:var(--row)}
.du-crumbs button:last-child{color:var(--fg);font-weight:600;cursor:default;background:none}
table.du td{vertical-align:middle;white-space:nowrap}
table.du td.n{white-space:normal;overflow-wrap:anywhere;width:100%}
table.du tr.dir td.n{cursor:pointer;color:var(--accent);font-weight:600}
table.du tr.dir:hover td{background:var(--row)}
table.du tr.mute td{color:var(--muted);font-style:italic}
table.du .pct{display:inline-block;width:110px;height:8px;background:var(--row);border:1px solid var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
table.du .pct i{display:block;height:100%;background:var(--accent)}
table.du .mono{text-align:right}
.du-x{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:4px}
.du-x:hover{color:var(--accent);background:var(--row)}
.du-x svg{width:15px;height:15px;vertical-align:middle}
.du-map{position:relative;height:calc(100vh - 370px);min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tm{position:absolute;box-sizing:border-box;border:1px solid rgba(20,29,58,.28);border-radius:2px;overflow:hidden;cursor:pointer;color:#141D3A}
.tm span{display:block;padding:1px 5px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:15px}
.tm span b{font:500 11px var(--f-mono);opacity:.75}
.tm:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.tm.leaf span{white-space:normal;word-break:break-word}
.tm.grey{background:repeating-linear-gradient(45deg,#e4e7ee 0 5px,#d9dde6 5px 10px);color:#5b6475}
.tm.grey:not([data-du-dir]){cursor:default}
.tm.grey:not([data-du-dir]):hover{outline:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header class="toolbar">

<script>
// Pont vers le programme : chaque fonction go*() passe par goCall et renvoie une promesse.
(() => {
  const pend = {}; let seq = 1;
  window.__goDone = (id, err, res) => { const p = pend[id]; if (!p) return; delete pend[id]; if (err) p.rej(err); else p.res(res); };
  const call = (m, a) => new Promise((res, rej) => { if (!window.goCall) { rej('Programme indisponible'); return; } const id = seq++; pend[id] = {res, rej}; window.goCall(id, m, a); });
  ['goInfo','goScan','goSensorsStart','goActions','goRunAction','goCancelAction','goOpenTool','goGetConfig','goSaveConfig','goExport','goOpenPath','goHistory','goLoadScan','goSaveHTML','goSaveCSV','goReboot','goCancelReboot','goBatteryTest','goBatteryCtl',
   'goSiteState','goSitePair','goSiteUnpair','goSiteCheck','goSiteTickets','goSiteSend','goOpenURL','goAtelierPart',
   'goDiskDrives','goDiskScan','goDiskCancel','goDiskDir','goDiskReveal','goDiskCSV','goDiskTree'].forEach(n => { window[n] = (...a) => call(n, a); });
})();
window.onerror = (msg, src, line) => { const el = document.getElementById('stMsg'); if (el) el.textContent = 'Erreur de l\'interface : ' + msg + ' (ligne ' + line + ')'; };
</script>
<script>
// ===================== pont vers le programme =====================
const api = {
  info: () => window.goInfo ? goInfo() : Promise.resolve({computer:'PC', admin:true}),
  scan: () => goScan(), sensors: () => goSensorsStart(), actions: () => goActions(),
  run: id => goRunAction(id), cancel: () => goCancelAction(), tool: id => goOpenTool(id),
  cfg: () => goGetConfig(), saveCfg: c => goSaveConfig(c), exp: b => goExport(b), open: p => goOpenPath(p),
  hist: () => window.goHistory ? goHistory() : Promise.resolve([]), load: f => goLoadScan(f), saveHTML: (n, h) => goSaveHTML(n, h), saveFile: (n, t) => goSaveCSV(n, t),
  reboot: (d, r) => window.goReboot ? goReboot(d, r) : Promise.resolve('indisponible'), cancelReboot: () => window.goCancelReboot ? goCancelReboot() : Promise.resolve(true),
  battTest: (d, l) => window.goBatteryTest ? goBatteryTest(d, l) : Promise.resolve(false), battCtl: c => window.goBatteryCtl ? goBatteryCtl(c) : Promise.resolve(false)
};

// ===================== utilitaires =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr = v => v == null ? [] : (Array.isArray(v) ? v : [v]);
const has = v => v !== null && v !== undefined && v !== '';
const days = iso => iso ? (Date.now() - new Date(iso)) / 864e5 : null;
const fdate = iso => iso ? new Date(iso).toLocaleDateString('fr-FR') : '—';
const fdt = iso => iso ? new Date(iso).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}) : '—';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ===================== règles de diagnostic =====================
const F = [], OK = [];
const add = (sev, cat, title, where, fix, cmd) => F.push({sev, cat, title, where, fix, cmd});
const ok = (cat, text) => OK.push({cat, text});

const CM = {1:'mal configuré',3:'pilote corrompu ou mémoire insuffisante',10:'ne peut pas démarrer',12:'ressources insuffisantes',14:'redémarrage requis',18:'pilotes à réinstaller',19:'registre corrompu',21:'en cours de suppression',22:'désactivé',24:'absent ou mal installé',28:'pilote non installé',29:'désactivé dans le BIOS',31:'pilote ne se charge pas',32:'service du pilote désactivé',37:'échec d\'initialisation du pilote',39:'pilote corrompu ou absent',41:'matériel non détecté',43:'arrêté après avoir signalé un problème',48:'pilote bloqué (incompatible)',52:'pilote non signé'};
const BSOD = {'0x00000124':'WHEA_UNCORRECTABLE_ERROR — erreur matérielle (CPU, RAM, alimentation, surchauffe)','0x0000001a':'MEMORY_MANAGEMENT — souvent la RAM','0x00000050':'PAGE_FAULT_IN_NONPAGED_AREA — RAM ou pilote','0x0000003b':'SYSTEM_SERVICE_EXCEPTION — pilote','0x000000d1':'DRIVER_IRQL_NOT_LESS_OR_EQUAL — pilote (réseau souvent)','0x0000000a':'IRQL_NOT_LESS_OR_EQUAL — pilote ou RAM','0x0000007e':'SYSTEM_THREAD_EXCEPTION_NOT_HANDLED — pilote','0x000000ef':'CRITICAL_PROCESS_DIED — fichiers système ou disque','0x00000133':'DPC_WATCHDOG_VIOLATION — pilote de stockage ou firmware SSD','0x0000009f':'DRIVER_POWER_STATE_FAILURE — pilote et mise en veille','0x00000116':'VIDEO_TDR_FAILURE — pilote graphique','0x00000139':'KERNEL_SECURITY_CHECK_FAILURE — pilote ou RAM','0x0000007a':'KERNEL_DATA_INPAGE_ERROR — disque ou câble'};
const bsodName = c => { if (!c) return ''; let h = c; if (/^\d+$/.test(c)) h = '0x' + (+c).toString(16).padStart(8,'0'); h = h.toLowerCase(); return BSOD[h] || h; };

function rules(D){
  const m = D.meta || {};
  // ---- Stockage
  arr(D.disks).forEach(d => {
    const w = `${d.name} (${d.bus || '?'}, ${d.sizeGB} Go)`;
    if (d.health && !/healthy|sain/i.test(d.health)) add(/unhealthy/i.test(d.health)||/predict|fail/i.test(d.op||'')?'crit':'warn','Stockage',`Disque en état « ${d.health} »`,w,
      `Windows considère ce disque comme défaillant (état opérationnel : ${esc(d.op)}).<ol><li><b>Sauvegardez immédiatement</b> les données.</li><li>Vérifiez avec l'outil du fabricant ou CrystalDiskInfo.</li><li>Remplacez le disque.</li></ol>`);
    else if (d.health) ok('Stockage', `${d.name} : état Windows « sain »`);
    if (has(d.wear)) { if (d.wear >= 90) add('crit','Stockage',`SSD usé à ${d.wear} %`,w,'Le SSD arrive en fin d\'endurance. Sauvegarde et remplacement rapides.');
      else if (d.wear >= 70) add('warn','Stockage',`SSD usé à ${d.wear} %`,w,'Usure avancée. Prévoir le remplacement dans les prochains mois.');
      else ok('Stockage', `${d.name} : usure ${d.wear} %`); }
    if (has(d.readErr) && d.readErr > 0) add('crit','Stockage',`${d.readErr} erreur(s) de lecture non corrigée(s)`,w,'Le disque n\'arrive plus à relire certaines données. Sauvegarde puis test long constructeur ; remplacement si les erreurs augmentent.');
    if (has(d.writeErr) && d.writeErr > 0) add('crit','Stockage',`${d.writeErr} erreur(s) d'écriture non corrigée(s)`,w,'Sauvegarde puis remplacement du disque.');
    if (has(d.temp) && d.temp >= 65) add('warn','Stockage',`Disque à ${d.temp} °C`,w,'Température élevée : vérifier la ventilation, nettoyer la poussière, ajouter un dissipateur au SSD M.2.');
    if (/HDD/i.test(d.media) && /^C|SATA/.test(d.bus||'') ) {}
  });
  if (arr(D.smartPredict).length) add('crit','Stockage','Le disque annonce une panne imminente (SMART)', arr(D.smartPredict).join(', '),
    '<b>Sauvegardez maintenant</b> puis remplacez le disque : l\'auto-diagnostic SMART prédit une défaillance.');
  const sysHdd = arr(D.disks).find(d => /HDD/i.test(d.media) && !/USB/i.test(d.bus));
  if (sysHdd) add('info','Performance','Disque dur mécanique détecté',`${sysHdd.name}`,'Si Windows est installé dessus, le passage à un SSD est l\'amélioration la plus visible (démarrage et ouverture des logiciels 3 à 5 fois plus rapides).');

  arr(D.volumes).forEach(v => {
    const w = `Lecteur ${v.letter}${v.label ? ' « ' + v.label + ' »' : ''} — ${v.freeGB} Go libres sur ${v.sizeGB} Go`;
    if (has(v.freePct)) {
      if (v.freePct < 10 || v.freeGB < 10) add('crit','Stockage',`Lecteur ${v.letter} presque plein (${v.freePct} % libre)`,w,
        'Windows ralentit et les mises à jour échouent sous ~10 % libre.<ol><li>Nettoyage de disque avec « Nettoyer les fichiers système ».</li><li>Paramètres › Système › Stockage › Fichiers temporaires.</li><li>Déplacer photos/vidéos vers un autre support.</li></ol>','cleanmgr /sageset:1 & cleanmgr /sagerun:1');
      else if (v.freePct < 20) add('warn','Stockage',`Lecteur ${v.letter} à ${100-v.freePct} % plein`,w,'Prévoir un nettoyage ou un disque plus grand.','cleanmgr /d ' + v.letter);
      else ok('Stockage', `Lecteur ${v.letter} : ${v.freePct} % libre`);
    }
    if (v.dirty) add('warn','Stockage',`Système de fichiers ${v.letter} marqué comme incohérent`,w,'Windows a détecté des erreurs NTFS. Planifier une vérification au prochain redémarrage.','chkdsk ' + v.letter + ' /f');
    if (v.letter === 'C:' && D.meta.isAdmin) {
      if (/on|1/i.test(String(v.bitlocker))) ok('Sécurité','C: chiffré par BitLocker');
      else if (has(v.bitlocker) && m.edition && !/core|home/i.test(m.edition)) add('info','Sécurité','Disque système non chiffré (BitLocker désactivé)',w,'En cas de vol du portable, les données sont lisibles. Activer BitLocker et conserver la clé de récupération (compte Microsoft ou impression).');
    }
  });
  if (D.junkGB >= 5) add('info','Stockage',`${D.junkGB} Go de fichiers temporaires`,'%TEMP%, C:\\Windows\\Temp, cache Windows Update','Espace récupérable sans risque.','cleanmgr /sageset:1 & cleanmgr /sagerun:1');

  // ---- Batterie
  const b = D.battery || {};
  if (b.present) {
    if (has(b.wearPct)) { if (b.wearPct >= 40) add('crit','Matériel',`Batterie usée à ${b.wearPct} %`,`${b.name} — ${b.cycles ?? '?'} cycles`,'Autonomie fortement réduite : remplacement de la batterie conseillé.');
      else if (b.wearPct >= 20) add('warn','Matériel',`Batterie usée à ${b.wearPct} %`,`${b.name} — ${b.cycles ?? '?'} cycles`,'Usure normale avec l\'âge. Activer la limite de charge à 80 % dans l\'utilitaire du constructeur (Lenovo Vantage, MyASUS, Dell Power Manager…) pour la ralentir.');
      else ok('Matériel', `Batterie : ${b.wearPct} % d'usure, ${b.cycles ?? '?'} cycles`); }
  }

  // ---- Périphériques
  const devs = arr(D.devices);
  devs.forEach(d => {
    const sev = d.code === 22 ? 'info' : (d.code === 28 ? 'warn' : 'warn');
    add(sev,'Pilotes',`${d.name} : ${CM[d.code] || 'erreur code ' + d.code}`,`Classe ${d.cls || '?'} — code ${d.code} — ${d.id}`,
      d.code === 22 ? 'Périphérique désactivé volontairement. Le réactiver dans le Gestionnaire de périphériques s\'il doit servir.' :
      d.code === 28 || d.code === 18 ? 'Installer le pilote : Windows Update (Paramètres › Windows Update › Options avancées › Mises à jour facultatives) ou site du constructeur, en cherchant l\'ID matériel ci-dessus.' :
      d.code === 43 ? 'Débrancher/rebrancher, mettre à jour le pilote et le BIOS. Si le code revient, le composant (ou son port) est suspect.' :
      'Gestionnaire de périphériques › clic droit › Désinstaller le périphérique, puis « Rechercher les modifications sur le matériel ». Mettre à jour le pilote depuis le site du constructeur.', 'devmgmt.msc');
  });
  if (!devs.length) ok('Pilotes','Aucun périphérique en erreur dans le Gestionnaire de périphériques');
  arr(D.gpu).forEach(g => { const a = days(g.driverDate);
    if (a && a > 730 && !/basic|microsoft/i.test(g.name)) add('info','Pilotes',`Pilote graphique daté de ${new Date(g.driverDate).getFullYear()}`,`${g.name} — ${g.driver}`,'Mettre à jour depuis le site Intel / AMD / NVIDIA ou du constructeur du PC.');
    if (/basic display|vga standard|de base/i.test(g.name)) add('warn','Pilotes','Carte graphique sans pilote (affichage de base)',g.name,'Installer le pilote graphique du constructeur : affichage lent, résolution limitée et pas d\'accélération sinon.'); });

  // ---- Stabilité
  const e = D.events || {};
  const bs = arr(e.bsod);
  if (bs.length) { const codes = [...new Set(bs.map(x => bsodName(x.code)))].filter(Boolean);
    add(bs.length >= 3 ? 'crit' : 'warn','Stabilité',`${bs.length} écran(s) bleu(s) sur 30 jours`, `Dernier : ${fdt(bs[0].date)}${D.events.dumps && D.events.dumps.count ? ' — ' + D.events.dumps.count + ' fichier(s) minidump' : ''}`,
      `Codes relevés :<ul>${codes.map(c => '<li><code>' + esc(c) + '</code></li>').join('')}</ul>Analyser C:\\Windows\\Minidump avec WinDbg ou BlueScreenView pour identifier le pilote en cause. Mettre à jour BIOS et pilotes, puis tester la RAM.`, 'mdsched.exe'); }
  else ok('Stabilité','Aucun écran bleu sur 30 jours');
  if (e.kernelPower41 > 0) add(e.kernelPower41 >= 3 ? 'warn' : 'info','Stabilité',`${e.kernelPower41} redémarrage(s) / arrêt(s) brutal(aux)`,'Journal Système — Kernel-Power 41',
    'Le PC s\'est éteint sans arrêt propre : coupure de courant, appui long sur le bouton, batterie vide, ou plantage/surchauffe. Si l\'utilisateur ne l\'explique pas : vérifier l\'alimentation, la température et les écrans bleus.');
  else ok('Stabilité','Aucun arrêt brutal sur 30 jours');
  if (e.whea > 0) add(e.whea >= 10 ? 'crit' : 'warn','Matériel',`${e.whea} erreur(s) matérielle(s) WHEA`,'Journal Système — WHEA-Logger',
    `Erreurs signalées directement par le processeur, la RAM ou le bus PCIe.${arr(e.wheaSample).length ? '<br>Exemple : <code>' + esc(arr(e.wheaSample)[0]) + '</code>' : ''}<ol><li>Mettre à jour BIOS et chipset.</li><li>Annuler tout overclocking / profil XMP-EXPO.</li><li>Tester la RAM (Diagnostic mémoire Windows ou MemTest86).</li><li>Si « PCI Express » : reseater la carte/SSD concerné, désactiver l'ASPM dans le BIOS.</li></ol>`, 'mdsched.exe');
  else ok('Matériel','Aucune erreur matérielle WHEA');
  const de = (e.disk || 0) + (e.ntfs || 0) + (e.storReset || 0);
  if (de > 0) add(de >= 5 ? 'crit' : 'warn','Stockage',`${de} erreur(s) disque dans le journal`,`disque : ${e.disk || 0} · NTFS : ${e.ntfs || 0} · réinitialisations contrôleur : ${e.storReset || 0}`,
    'Secteurs défectueux, câble ou contrôleur instable.<ol><li>Sauvegarder.</li><li>Lancer un test SMART long et <code>chkdsk C: /r</code>.</li><li>Pour un SSD NVMe : mettre à jour son firmware et le pilote de stockage (Intel RST / AMD).</li></ol>','chkdsk C: /scan');
  else ok('Stockage','Aucune erreur disque ou NTFS dans le journal');
  if (e.memDiag && e.memDiag.id === 1101) add('crit','Matériel','Le dernier diagnostic mémoire a trouvé des erreurs',fdt(e.memDiag.date),'Une ou plusieurs barrettes de RAM sont défectueuses. Tester barrette par barrette (MemTest86) et remplacer la défaillante.');
  if (has(D.reliability)) { if (D.reliability < 3) add('warn','Stabilité',`Indice de fiabilité Windows : ${D.reliability}/10`,'Analyse de fiabilité','Ouvrir l\'Analyse de fiabilité pour voir chaque plantage et son origine jour par jour.','perfmon /rel');
    else ok('Stabilité', `Indice de fiabilité : ${D.reliability}/10`); }
  const ac = arr(e.appCrashes);
  if (e.appCrashTotal >= 5) add('info','Logiciel',`${e.appCrashTotal} plantages d'applications`,'Journal Application — événement 1000',
    `Les plus fréquents :<ul>${ac.slice(0,5).map(a => `<li>${esc(a.app)} : ${a.count}×</li>`).join('')}</ul>Mettre à jour ou réinstaller ces logiciels ; si c'est <code>explorer.exe</code>, suspecter une extension de l'explorateur (antivirus, cloud, archiveur).`,'perfmon /rel');
  const sc = arr(e.svcCrash);
  if (sc.length) add('info','Logiciel',`Services Windows qui s'arrêtent de façon inattendue`,'Journal Système — 7031/7034',`<ul>${sc.map(s => `<li>${esc(s.svc)} : ${s.count}×</li>`).join('')}</ul>Mettre à jour ou réinstaller le logiciel propriétaire du service.`);

  // ---- Matériel / perf
  const mem = D.mem || {};
  if (mem.totalGB && mem.totalGB < 7.5) add('warn','Performance',`Seulement ${mem.totalGB} Go de RAM`,`${arr(mem.modules).length} barrette(s), ${mem.slots ?? '?'} emplacement(s)`,'8 Go est le minimum confortable pour Windows 11, 16 Go pour un usage bureautique avec navigateur chargé.');
  if (mem.usedPct >= 90) add('warn','Performance',`Mémoire utilisée à ${mem.usedPct} %`,'Au moment de l\'analyse','Voir les processus les plus gourmands dans l\'onglet Matériel. Fermer les applications inutiles, réduire les programmes au démarrage, ou ajouter de la RAM.');
  arr(D.thermal).forEach(t => { if (t.c >= 90 && t.c < 150) add('warn','Matériel',`Zone thermique à ${t.c} °C`,t.zone,'Nettoyer les ventilateurs et grilles, renouveler la pâte thermique si le PC a plusieurs années, vérifier que les ventilateurs tournent.'); });
  if (m.biosDate && days(m.biosDate) > 3*365) add('info','Matériel',`BIOS de ${new Date(m.biosDate).getFullYear()}`,`${m.bios}`,'Vérifier les mises à jour du BIOS chez le constructeur : correctifs de sécurité (Spectre, firmware ME…) et de stabilité.');
  if (m.uptimeDays > 14) add('info','Performance',`PC allumé depuis ${Math.floor(m.uptimeDays)} jours sans redémarrage`,`Dernier démarrage : ${fdt(m.lastBoot)}`,'Le démarrage rapide fait que « Arrêter » ne remet pas Windows à zéro. Redémarrer régulièrement (ou désactiver le démarrage rapide) applique les mises à jour et libère la mémoire.');
  const st = arr(D.startup);
  if (st.length > 12) add('info','Performance',`${st.length} programmes lancés au démarrage`,'Gestionnaire des tâches › Démarrage','Désactiver ceux qui ne sont pas indispensables pour accélérer le démarrage.','taskmgr /0 /startup');

  // ---- Mises à jour
  const u = D.updates || {};
  const build = +m.build || 0;
  const EOL = [[0,21999,'2025-10-14','Windows 10'],[22000,22000,'2023-10-10','Windows 11 21H2'],[22621,22621,'2024-10-08','Windows 11 22H2'],[22631,22631,'2025-11-11','Windows 11 23H2'],[26100,26100,'2026-10-13','Windows 11 24H2'],[26200,26200,'2027-10-12','Windows 11 25H2']];
  const ent = /enterprise|education/i.test(m.edition || '');
  const row = EOL.find(r => build >= r[0] && build <= r[1]);
  if (row && new Date(row[2]) < new Date() && !(ent && build >= 22000)) add(build < 22000 ? 'crit' : 'warn','Mises à jour',`${row[3]} n'est plus pris en charge depuis le ${fdate(row[2])}`,`${m.os} — build ${build}.${m.ubr ?? ''}`,
    build < 22000 ? 'Plus aucun correctif de sécurité (sauf abonnement ESU). Passer à Windows 11 si le matériel est compatible, sinon souscrire aux mises à jour étendues ou prévoir le remplacement du poste.' : 'Installer la dernière version de Windows 11 : Paramètres › Windows Update, ou l\'Assistant d\'installation Windows 11.','ms-settings:windowsupdate');
  else if (row) ok('Mises à jour', `${row[3]} pris en charge jusqu'au ${fdate(row[2])}`);
  const last = u.lastSuccess || u.lastHotfix; const age = days(last);
  if (age !== null) { if (age > 60) add(age > 120 ? 'crit' : 'warn','Mises à jour',`Aucune mise à jour installée depuis ${Math.round(age)} jours`,`Dernière : ${fdate(last)}${u.lastTitle ? ' — ' + u.lastTitle : (u.lastHotfixId ? ' — ' + u.lastHotfixId : '')}`,
      'Lancer Windows Update. Si les mises à jour échouent en boucle : réinitialiser les composants Windows Update (arrêter wuauserv/bits, vider SoftwareDistribution).','ms-settings:windowsupdate');
    else ok('Mises à jour', `Dernière mise à jour il y a ${Math.round(age)} jours`); }

function findingsFor(n){
  if (!n || !D) return [];
  if (n.cats.includes('*')) return F;
  return F.filter(f => n.cats.includes(f.cat) || (n.match && n.match.test(f.title + ' ' + (f.where||''))));
}
function worst(list){ return list.reduce((w,f) => !w || ORDER[f.sev] < ORDER[w] ? f.sev : w, null); }

function renderTree(){
  const N = nodes();
  $('#tree').innerHTML = N.map(n => {
    if (n.sect) return `<div class="sect">${n.sect}</div>`;
    const fs = n.id === 'problems' ? F : (n.cats.length || n.match ? findingsFor(n) : []);
    let badge = '';
    if (n.id === 'problems' && D) { const w = worst(F); badge = `<span class="cnt ${w || 'ok'}">${F.length}</span>`; }
    else if (n.id === 'passed' && D) badge = `<span class="cnt ok">${OK.length}</span>`;
    else if (D && (n.cats.length || n.match) && n.id !== 'report') { const w = worst(fs); badge = `<span class="dot ${w || 'ok'}" title="${w ? fs.length + ' constat(s)' : 'OK'}"></span>`; }
    if (n.id === 'repair' && run.id) badge = '<span class="spin" title="Réparation en cours"></span>';
    if (n.id === 'disk-usage' && DU.running) badge = '<span class="spin" title="Analyse en cours"></span>';
    return `<div class="node${view === n.id ? ' sel' : ''}" style="--d:${n.d}" data-id="${esc(n.id)}" tabindex="0" role="treeitem">${ico(n.icon)}<span class="lbl">${esc(n.label)}</span>${badge}</div>`;
  }).join('');  markToolbar();
}
$('#tree').addEventListener('click', e => { const n = e.target.closest('.node'); if (n) go(n.dataset.id); });
$('#tree').addEventListener('keydown', e => {

});

const ACTMAP = [[/RestoreHealth/,'dism'],[/chkdsk \S+ \/f/,'chkdskboot'],[/chkdsk \S+ \/scan/,'chkdsk'],[/cleanmgr/,'cleanup'],[/advfirewall/,'firewall'],[/SMB1/,'smb1off'],[/shutdown \/r/,'reboot'],[/wuauserv start/,'wuenable'],[/ipconfig \/(release|renew)/,'netreset'],[/flushdns/,'dnsflush'],[/MpCmdRun/,'defender'],[/mdsched/,'memtest'],[/ms-settings:windowsupdate/,'wuscan']];
function fixButtons(f){
  const c = f.cmd || ''; const out = [];
  const a = ACTMAP.find(m => m[0].test(c));
  if (a && ACTIONS.find(x => x.id === a[1])) out.push(`<button class="btn go" data-act="${a[1]}">Réparer…</button>`);
  if (/RestoreHealth/.test(c)) out.push(`<button class="btn" data-act="sfc">Puis SFC…</button>`);
  const t = TOOLMAP.find(m => m[0].test(c) || (m[1]==='minidump' && /Minidump/.test(f.fix)));
  if (t) out.push(`<button class="btn" data-tool="${t[1]}">Ouvrir : ${t[2]}</button>`);
  if (c && !a) out.push(`<code>${esc(c)}</code>`);
  return out.length ? `<div class="acts">${out.join('')}</div>` : '';
}
function findingCards(list){
  if (!list.length) return '';
  return list.slice().sort((a,b) => ORDER[a.sev] - ORDER[b.sev]).map(f => `
    <article class="f ${f.sev}"><div class="top"><span class="sev">${SEVL[f.sev]}</span><h3>${esc(f.title)}</h3><span class="cat">${esc(f.cat)}</span></div>
    ${f.where ? `<div class="where">${esc(f.where)}</div>` : ''}<div class="fix">${f.fix}</div>${fixButtons(f)}</article>`).join('');
}
$('#content').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (a) { highlightAct = a.dataset.act; run.confirm = a.dataset.act; go('repair'); setTimeout(() => { const el = document.getElementById('act-' + highlightAct); el && el.scrollIntoView({block:'center'}); }, 30); return; }
  const t = e.target.closest('[data-tool]'); if (t) { api.tool(t.dataset.tool); return; }
  const n = e.target.closest('[data-nav]'); if (n) { go(n.dataset.nav); return; }
});

const V = {};
function render(){
  const c = $('#content');
  if (!D && !['summary','atelier','sensors','tests','disk-usage','repair','report','site','battery-test'].includes(view)) view = 'summary';
  const at = view === 'atelier';
  $('#atelier').hidden = !at; c.hidden = at;
  if (at) { c.innerHTML = ''; atelierSync(); return; }
  const n = nodes().find(x => x.id === view);
  const fn = V[view.split(':')[0]];
  c.innerHTML = fn ? fn(view.split(':')[1], n) : '';
  afterRender();
}
function afterRender(){
  if (view === 'summary') drawMini();
  if (view === 'sensors') { renderSensorTable(); drawSensors(); }
  if (view === 'software') { const q = $('#swq'); q && q.addEventListener('input', () => drawSoftware(q.value)); drawSoftware(''); }
  if (view === 'battery-test' && BT.running) drawBattChart();
  if (view === 'disk-usage' && DU.tab === 'map') duDrawMap();
}

V.summary = () => {
  let top = '';
  if (scanState && scanState.running) {
    const p = Math.round(100 * (scanState.step || 0) / (scanState.total || 14));
    top = `<div class="card scanning"><div class="lbl"><span>${esc(scanState.label || 'Préparation…')}</span><span class="mono">${scanState.step || 0}/${scanState.total || 14}</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="sub" style="color:var(--muted);font-size:12px">Analyse en lecture seule : rien n'est modifié. Durée habituelle 30 à 90 secondes.</div></div>`;
  } else if (scanState && scanState.error) top = `<div class="banner">${esc(scanState.error)}</div>`;
  if (!D) return head('Résumé', esc(info.computer || '')) + `<div class="stack">${top || '<div class="empty">Cliquez sur « Analyser » pour lancer le diagnostic.</div>'}${miniBlock()}</div>`;
  const m = D.meta || {}, c = {crit:0, warn:0, info:0}; F.forEach(f => c[f.sev]++);
  const score = Math.max(5, 100 - c.crit * 15 - c.warn * 5 - c.info * 1);
  const col = score >= 80 ? 'var(--ok)' : score >= 50 ? 'var(--warn)' : 'var(--crit)';
  const R = 40, L = 2 * Math.PI * R;
  const ring = `<svg class="ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--row)" stroke-width="9"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L * score / 100} ${L}" transform="rotate(-90 48 48)"/><text x="48" y="57" text-anchor="middle">${score}</text></svg>`;
  const verdict = c.crit ? `${c.crit} problème(s) critique(s) à traiter en priorité` : c.warn ? `Rien de critique, ${c.warn} point(s) à corriger` : 'PC en bonne santé';
  const tiles = nodes().filter(n => n.id && !['summary','problems','sensors','repair','report','passed','system','cpu'].includes(n.id) && !n.d && (n.cats.length || n.match)).map(n => {
    const fs = findingsFor(n), w = worst(fs);
    return `<div class="cattile" data-nav="${n.id}"><b><span class="dot ${w || 'ok'}"></span>${esc(n.label)}</b><span>${fs.length ? fs.length + ' constat(s)' : 'Aucun problème'}</span></div>`; }).join('');
  const disks = arr(D.disks).map(d => `${esc(d.name)} — ${d.sizeGB} Go ${esc(d.media)}`).join('<br>');
  return head('Résumé', `${esc(maker(m))} ${esc(m.model)} · ${esc(m.os)} ${esc(m.displayVersion || '')}`, `<span class="sub" style="color:var(--muted)">Analysé le ${fdt(m.scanDate)} en ${m.duration ?? '?'} s</span>`) +
  `<div class="stack">${top}
    <div class="sum">
      <div class="stack">
        <div class="card score">${ring}<div class="verdict"><h2>${verdict}</h2><p>${c.crit} critique · ${c.warn} à corriger · ${c.info} conseil · ${OK.length} contrôles réussis</p>
          <div class="acts" style="display:flex;gap:8px;margin-top:10px"><button class="btn go" data-nav="problems">Voir les problèmes</button><button class="btn" data-nav="report">Rapport client</button></div></div></div>
        <div class="cats">${tiles}</div>
        ${F.length ? '<div class="stack">' + findingCards(F.filter(f => f.sev !== 'info').slice(0, 4)) + '</div>' : ''}
      </div>
      <div class="stack">
        ${props([['Ordinateur', [['Nom', esc(m.computer)], ['Modèle', esc([maker(m), m.model].join(' '))], ['N° de série', `<span class="mono">${esc(m.serial)}</span>`], ['Windows', esc(m.os) + ' ' + esc(m.displayVersion || '')], ['Processeur', esc((D.cpu||{}).name)], ['Mémoire', (D.mem||{}).totalGB + ' Go'], ['Graphique', arr(D.gpu).map(g => esc(g.name)).join('<br>')], ['Stockage', disks], ['Batterie', D.battery && D.battery.present && has(D.battery.wearPct) ? D.battery.wearPct + ' % d\'usure' : '']]]])}
        ${miniBlock()}
      </div>
    </div></div>`;
};
function miniBlock(){ return `<div class="mini">${[['cpu','Processeur','%'],['ram','Mémoire','%'],['disk','Disque','%'],['netR','Réseau ↓','Mbit/s']].map(([id,l,u]) => `<div class="m"><div class="k">${l}<b id="mv-${id}">${S[id] ? fmtV(S[id].v, u) : '—'}</b></div><canvas id="mc-${id}"></canvas></div>`).join('')}</div>`; }

V.problems = () => {

// carte des dossiers (treemap « squarified ») : surface proportionnelle à la taille
function duSquarify(items, x, y, w, h){
  const out = [], total = items.reduce((a, b) => a + b.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const rest = items.map(it => ({it, a: it.v * w * h / total}));
  while (rest.length) {
    const short = Math.min(w, h); let row = [], best = Infinity;
    while (rest.length) {
      const cand = row.concat(rest[0]), sum = cand.reduce((a, b) => a + b.a, 0);
      const mx = Math.max(...cand.map(c => c.a)), mn = Math.min(...cand.map(c => c.a));
      const worst = Math.max(short * short * mx / (sum * sum), (sum * sum) / (short * short * mn));
      if (worst > best) break;
      row = cand; best = worst; rest.shift();
    }
    const sum = row.reduce((a, b) => a + b.a, 0);
    if (w >= h) { const rw = sum / h; let cy = y; row.forEach(r => { const rh = r.a / rw; out.push({it: r.it, x, y: cy, w: rw, h: rh}); cy += rh; }); x += rw; w -= rw; }
    else { const rh = sum / w; let cx = x; row.forEach(r => { const rw = r.a / rh; out.push({it: r.it, x: cx, y, w: rw, h: rh}); cx += rw; }); y += rh; h -= rh; }
  }
  return out;
}
function duMapHTML(t, W, H, path){
  const total = t.size || 1, html = [];
  const kids = n => { const a = arr(n.children).map(c => ({v: c.size, n: c}));
    if (n.own) a.push({v: n.own, own: true}); if (n.rest) a.push({v: n.rest, rest: true});
    return a.filter(i => i.v > 0).sort((a, b) => b.v - a.v); };
  const pct = v => (100 * v / total).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' %';
  const draw = (n, x, y, w, h, depth, hue, p) => {
    duSquarify(kids(n), x, y, w, h).forEach((r, i) => {
      const it = r.it, hu = depth === 0 ? (215 + i * 47) % 360 : hue;
      const box = `left:${r.x.toFixed(1)}px;top:${r.y.toFixed(1)}px;width:${Math.max(0, r.w - 1).toFixed(1)}px;height:${Math.max(0, r.h - 1).toFixed(1)}px`;
      const lbl = r.w > 46 && r.h > 16;
      if (it.own || it.rest) {
        const name = it.own ? 'Fichiers de ' + (n.name || p) : 'Petits dossiers de ' + (n.name || p);
        html.push(`<div class="tm leaf grey"${depth ? ` data-du-dir="${n.id}"` : ''} style="${box}" title="${esc(name)} : ${duSize(it.v)} (${pct(it.v)})">${lbl && r.h > 30 ? `<span>${it.own ? 'fichiers' : 'autres'}</span>` : ''}</div>`);
        return;
      }
      const c = it.n, cp = p.replace(/[\\/]$/, '') + '\\' + c.name;
      const col = `hsl(${hu} ${depth === 0 ? 62 : 55}% ${Math.min(90, 70 + depth * 7)}%)`;
      const tip = `${cp}\n${duSize(c.size)} (${pct(c.size)})`;
      const hdr = r.h > 38 && r.w > 60 && arr(c.children).length ? 17 : 0;
      html.push(`<div class="tm${hdr ? '' : ' leaf'}" data-du-dir="${c.id}" style="${box};background:${col}" title="${esc(tip)}">${lbl ? `<span>${esc(c.name)} <b>${duSize(c.size)}</b></span>` : ''}</div>`);
      if (hdr) draw(c, r.x + 2, r.y + hdr, r.w - 5, r.h - hdr - 3, depth + 1, hu, cp);
    });
  };
  draw(t, 0, 0, W, H, 0, 0, path);
  return html.join('');
}

// --- moteur de la file de réparations
async function startQueue(){
  const ids = [];
  if (QUEUE.restore && ACTIONS.find(a => a.id === 'restore')) ids.push('restore');
  ACTIONS.forEach(a => { if (a.id !== 'restore' && QUEUE.sel.has(a.id)) ids.push(a.id); });
  if (!ids.length) { status('Sélectionnez au moins une réparation.'); return; }
  QUEUE.ids = ids; QUEUE.i = 0; QUEUE.active = true; QUEUE.results = {}; QUEUE.stop = false;
  rebootSuggested = false;
  status('Enchaînement de ' + ids.length + ' réparation(s)…'); renderTree(); render();
  queueRunCurrent();
}
async function queueRunCurrent(){
  if (QUEUE.stop || QUEUE.i >= QUEUE.ids.length) return finishQueue();
  const id = QUEUE.ids[QUEUE.i];
  run.logs[id] = []; delete run.result[id];
  const err = await api.run(id);
  if (err) { run.logs[id] = [err]; QUEUE.results[id] = {ok:false}; QUEUE.i++; if (view === 'repair') render(); return queueRunCurrent(); }
  run.id = id; run.step = ''; status('Réparation ' + (QUEUE.i + 1) + '/' + QUEUE.ids.length + ' : ' + (ACTIONS.find(a => a.id === id) || {}).title); renderTree(); if (view === 'repair') render();
}
function queueOnDone(p){
  const a = ACTIONS.find(x => x.id === p.id) || {};
  QUEUE.results[p.id] = {ok: p.ok, reboot: a.reboot};
  QUEUE.i++;
  queueRunCurrent();
}
async function finishQueue(){
  QUEUE.active = false;
  const okCount = Object.values(QUEUE.results).filter(r => r.ok).length;
  const anyReboot = QUEUE.ids.some(id => { const a = ACTIONS.find(x => x.id === id); return a && a.reboot && QUEUE.results[id] && QUEUE.results[id].ok; });
  if (!QUEUE.stop && QUEUE.reboot && anyReboot) {
    status('Réparations terminées (' + okCount + '/' + QUEUE.ids.length + ') — redémarrage nécessaire.');
    RB.resume = QUEUE.resume;
    const err = await api.reboot(60, QUEUE.resume);
    if (!err) { startRebootCountdown(60); return; }
    status('Redémarrage impossible : ' + err);
  } else {
    status('Réparations terminées : ' + okCount + '/' + QUEUE.ids.length + ' réussie(s)' + (QUEUE.stop ? ' (arrêté)' : '') + (anyReboot && !QUEUE.reboot ? ' — un redémarrage est conseillé.' : ''));
  }
  renderTree(); if (view === 'repair') render();
}
function startRebootCountdown(delay){
  RB.active = true; RB.seconds = delay; rebootSuggested = false;
  if (RB.timer) clearInterval(RB.timer);
  RB.timer = setInterval(() => { RB.seconds--; const el = $('#rbCount'); if (el) el.textContent = Math.max(0, RB.seconds); if (RB.seconds <= 0) clearInterval(RB.timer); }, 1000);
  status('Redémarrage programmé dans ' + delay + ' s' + (RB.resume ? ' (reprise automatique)' : ''));
  if (view === 'repair') render();
}
function stopRebootCountdown(){ RB.active = false; if (RB.timer) { clearInterval(RB.timer); RB.timer = null; } if (view === 'repair') render(); }
function appendLog(id, line, replace){
  const L = run.logs[id] || (run.logs[id] = []);

  if (t) { const atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 20; t.textContent = L.join('\n'); if (atBottom) t.scrollTop = t.scrollHeight; }

}

// évalue un jeu de données avec les mêmes règles que l'interface
function evaluate(data){
  const sF = F.splice(0), sO = OK.splice(0);
  try { rules(data); } catch (_) {}
  const r = {F: F.splice(0), OK: OK.splice(0)};
  F.push(...sF); OK.push(...sO);
  return r;
}
const fkey = f => f.cat + '|' + f.title.replace(/[\d.,]+/g, '#').replace(/\s+/g, ' ').trim();
const HISTO = /écran\(s\) bleu|redémarrage\(s\) \/ arrêt|erreur\(s\) matérielle|erreur\(s\) disque dans le journal|plantages d'applications|Services Windows qui s'arrêtent|Indice de fiabilité/i;

const levelOf = list => list.some(f => f.sev === 'crit' && !f.histo) ? 'red' : list.some(f => f.sev === 'warn' || (f.sev === 'crit' && f.histo)) ? 'orange' : 'green';

}
// compare deux évaluations
function compare(before, after){
  const bk = new Map(before.F.map(f => [fkey(f), f]));
  const ak = new Map(after.F.map(f => [fkey(f), f]));
  const resolved = before.F.filter(f => !ak.has(fkey(f)));
  const remaining = after.F.filter(f => bk.has(fkey(f))).map(f => ({...f, histo: HISTO.test(f.title)}));
  const added = after.F.filter(f => !bk.has(fkey(f)));
  return {resolved, remaining, added, afterList: [...remaining, ...added]};
}

  const mood = doc.mood, v = doc.viability;

  let scale = '';
  if (v) {
    const pos = n => Math.max(2, Math.min(98, n)), edge = n => n > 82 ? ' end' : n < 18 ? ' start' : '';
    const later = v.potential > v.score, twoRows = later && v.potential - v.score < 24;
    scale = `<section class="cd-sec"><h3 class="cd-h">Où en est votre ordinateur ?</h3><div class="cd-scale"><div class="cd-bar"><span class="z crit">À remplacer</span><span class="z warn">À améliorer</span><span class="z good">En forme</span></div>
      <div class="cd-marks${twoRows ? ' two-rows' : ''}"><span class="cd-mark${edge(v.score)}" style="left:${pos(v.score)}%"><b>Aujourd’hui</b></span>${later ? `<span class="cd-mark after${edge(v.potential)}${twoRows ? ' row2' : ''}" style="left:${pos(v.potential)}%"><b>Après nos conseils</b></span>` : ''}</div></div></section>`;
  }

  if (cmp) {
    const lb = CD_LV[levelOf(before.F)], la = CD_LV[levelOf(afterList)];
    compared = `<section class="cd-sec"><h3 class="cd-h">Avant et après notre intervention</h3>
      <div class="cd-cmp"><div class="cd-side ${lb}">${cdFace(lb, 46)}<div><b>Avant</b><span>${fdt(BEFORE_META && BEFORE_META.date)} · note ${scoreOf(before.F)}/100</span></div></div>
      <span class="cd-arrow">→</span>
      <div class="cd-side ${la}">${cdFace(la, 46)}<div><b>Après</b><span>${fdt(m.scanDate)} · note ${scoreOf(afterList)}/100</span></div></div></div>
      <div class="cd-stats"><span class="good"><b>${cmp.resolved.length}</b> problème(s) résolu(s)</span><span><b>${cmp.remaining.length}</b> point(s) restant(s)</span>${cmp.added.length ? `<span><b>${cmp.added.length}</b> nouveau(x) point(s)</span>` : ''}</div>
      ${cmp.resolved.length ? `<ul class="cd-done">${cmp.resolved.map(f => `<li>✓ ${esc(f.title)}</li>`).join('')}</ul>` : ''}</section>`;
  }

  const acts = brand.actions || [];

      <p class="cd-sub">${after.OK.length} contrôle(s) sans anomalie : ${after.OK.slice(0, 40).map(o => esc(o.text)).join(' · ')}</p></section>`;

const BT = {running:false, paused:false, points:[], elapsed:0, target:0, load:false, dur:10, result:null, error:null, now:null};
const battHealth = () => { const b = (D && D.battery && D.battery.present) ? D.battery : null; if (!b || !has(b.wearPct)) return null; return Math.max(0, Math.round(100 - b.wearPct)); };
function battVerdict(h){ return h >= 80 ? ['green','Bonne santé'] : h >= 60 ? ['orange','Usée — autonomie réduite'] : h >= 40 ? ['orange','Très usée — remplacement conseillé'] : ['red','À remplacer']; }
const wfmt = mw => (Math.abs(mw) / 1000).toFixed(1) + ' W';
const vfmt = mv => (mv / 1000).toFixed(2) + ' V';
function analyzeBatt(){
  const pts = BT.points; if (pts.length < 2) return {anomalies:['Test trop court pour conclure.'], ok:false};
  const a = [], disc = pts.filter(p => p.rate > 0);
  const onACall = pts.every(p => p.ac);
  const restDrop = pts[0].rest - pts[pts.length - 1].rest;
  const volts = pts.map(p => p.volt).filter(v => v > 0);
  const sag = volts.length > 2 ? (volts[0] - Math.min(...volts)) / volts[0] : 0;
  const avgW = disc.length ? disc.reduce((s, p) => s + p.rate, 0) / disc.length : 0;
  // Capacité réelle estimée à partir des mesures (utile quand Windows ne donne pas la capacité).
  const measured = pts.filter(p => p.pct > 0 && p.rest > 0).map(p => p.rest / (p.pct / 100));
  const measuredFull = measured.length ? Math.round(measured.reduce((s, v) => s + v, 0) / measured.length) : 0;
  const knownFull = D && D.battery && D.battery.full ? D.battery.full : 0;
  const full = knownFull || measuredFull;
  const runtimeH = avgW > 0 && full ? full / avgW : 0;
  if (onACall) a.push('L\'ordinateur est resté sur secteur : débranchez le chargeur pour un test de décharge significatif.');
  if (sag > 0.10) a.push('Chute de tension de ' + Math.round(sag * 100) + ' % sous charge : résistance interne élevée, batterie fatiguée.');
  if (restDrop <= 0 && !onACall) a.push('Capacité restante figée pendant la décharge : la jauge du contrôleur ne remonte pas de mesure fiable (recalibrage conseillé).');
  return {anomalies:a, ok:a.length === 0, avgW, runtimeH, restDrop, onACall, measuredFull, knownFull};
}

const ATL = {ready:null, cur:undefined};
function atelierFrame(){
  if (ATL.ready) return ATL.ready;
  ATL.ready = (async () => {
    let html = '', off = 0;
    for (;;) { const p = await goAtelierPart(off); html += p.data || ''; if (!p.next) break; off = p.next; }
    if (!html) throw 'Diag atelier absent de cet exe';
    const cfg = {shop: CFG.shop || 'Planete-Computers 2.0', phone: CFG.phone || '', address: CFG.address || '', email: CFG.email || ''};
    html = html.replace(/<head>/i, '<head><script>window.DIAG_APP = ' + JSON.stringify(cfg).replace(/</g, '\\u003c') + ';<\/script>');
    const f = $('#atelier');
    await new Promise(res => { f.addEventListener('load', res, {once:true}); f.srcdoc = html; });
    return f.contentWindow;
  })();
  ATL.ready.catch(err => { ATL.ready = null; status('Diag atelier indisponible : ' + err); });
  return ATL.ready;
}
const doneList = () => done.map(d => ({id:d.id, title:d.title, ok:d.ok, at:d.at}));
const baseName = f => String(f || '').split(/[\\/]/).pop();
// Shows the current analysis (and the repairs of this session) in the Diag atelier.
async function atelierSync(){
  let w;
  try { w = await atelierFrame(); } catch (_) { return null; }
  if (D && ATL.cur !== curFile()) { w.diagAppLoad(JSON.stringify(D), baseName(curFile()) || 'Analyse.json'); ATL.cur = curFile(); }
  if (D && ATL.cur === curFile()) { w.diagAppSetActions(doneList()); atelierLog(w); testsPush(w); }
  return w;
}
// The sensors log of this session goes with the current analysis (curves in the
// Diag atelier and on the site); a HWiNFO log added in the Diag atelier wins.
function atelierLog(w){
  if (!w.diagAppSetLog) return;
  const csv = SLOG.send && SLOG.rows.length >= 30 ? sensorLogCSV() : null;
  w.diagAppSetLog(csv, sensorLogName());
}
// What « Envoyer au ticket » sends on the site, for the current analysis or a saved one.
async function atelierExport(file, acts){
  const w = file ? await atelierFrame() : await atelierSync();
  if (!w) throw 'Diag atelier indisponible';
  if (file) { w.diagAppLoad(JSON.stringify(await api.load(file)), baseName(file)); ATL.cur = file; }
  w.diagAppSetActions(acts || []);
  const exp = await w.diagAppExport();
  if (!exp) throw 'Aucune analyse à envoyer';
  return exp;
}
window.addEventListener('message', e => { if (!e.data) return;
  if (e.data.diagAtelier === 'send') go('site');
  if (e.data.diagAtelier === 'checks') testsPull(); });

$('#content').addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 's-pair') {
    const server = $('#s-server').value.trim(), token = $('#s-token').value.trim();
    t.disabled = true; $('#s-pmsg').textContent = 'Vérification…';
    try { SITE.state = await sapi.pair(server, token); SITE.pairErr = ''; SITE.tickets = null; } catch (err) { SITE.pairErr = String(err); }
    render(); return;
  }
  if (t.id === 's-unpair') { SITE.state = await sapi.unpair(); SITE.tickets = null; SITE.ticket = null; SITE.result = null; render(); return; }
  if (t.id === 's-check') { t.disabled = true; SITE.state = await sapi.check(); SITE.tickets = null; render(); return; }
  if (t.id === 's-search') { SITE.q = $('#s-q').value.trim(); siteSearch(); return; }
  if (t.id === 's-quick') { SITE.quick = true; SITE.ticket = null; SITE.result = null; render(); return; }
  const tk = t.closest('[data-sticket]');
  if (tk) { SITE.ticket = (SITE.tickets || []).find(x => x.id === +tk.dataset.sticket) || null; SITE.quick = false; SITE.result = null; render(); return; }
  const u = t.closest('[data-surl]'); if (u) { sapi.url(u.dataset.surl); return; }
  if (t.id === 's-send') {
    const acts = $('#s-acts') && $('#s-acts').checked ? done.map(d => ({id:d.id, title:d.title, ok:d.ok, at:d.at})) : [];
    SITE.sending = true; SITE.sendErr = ''; SITE.result = null; render();
    try { SITE.result = await sapi.send(SITE.quick ? 0 : SITE.ticket.id, acts, SITE.file); status('Rapport envoyé au site.'); }
    catch (err) { SITE.sendErr = String(err) + ' L\'analyse reste enregistrée dans PC2Diag-rapports : vous pourrez l\'envoyer plus tard depuis cet écran.'; }
    SITE.sending = false; render();
  }
});

window.onGo = (kind, p) => {
  if (kind === 'site') { SITE.state = p; if (view === 'site') render(); }
  if (kind === 'scanProgress') { scanState = {running:true, ...p}; status(`Analyse ${p.step}/${p.total} — ${p.label}`); if (view === 'summary') { const lb = document.querySelector('.scanning .lbl'); if (lb) { lb.innerHTML = `<span>${esc(p.label)}</span><span class="mono">${p.step}/${p.total}</span>`; document.querySelector('.scanning .progress i').style.width = Math.round(100 * p.step / p.total) + '%'; } else render(); } }
  if (kind === 'scanDone') { SESSION.push({file: p.file || ('session-' + (SESSION.length + 1)), date: new Date().toISOString(), data: p.data}); beforeSel = null; refreshHist().then(() => { if (view === 'report') render(); }); D = p.data; SITE.file = ''; SITE.result = null; if (ATL.ready || view === 'atelier') atelierSync(); scanState = null; $('#bScan').disabled = false; F.length = 0; OK.length = 0; rules(D); status(`Analyse terminée en ${p.seconds} s — ${F.length} constat(s)`); renderTree(); render(); }
  if (kind === 'scanError') { scanState = {error: p}; $('#bScan').disabled = false; status('Échec de l\'analyse'); render(); }
  if (kind === 'sensors') onSensors(p);
  if (kind === 'duProgress') duOnProgress(p);
  if (kind === 'duDone') { DU.running = false; DU.result = p; DU.dir = p.view; DU.prog = null; status(`Espace disque : ${p.root} analysé, ${duSize(p.size)} en ${Math.round(p.seconds)} s`); renderTree(); if (view === 'disk-usage') render(); }
  if (kind === 'duError') { DU.running = false; DU.err = p; status(p); renderTree(); if (view === 'disk-usage') render(); }
  if (kind === 'battPoint') { BT.now = p; BT.points.push(p); if (view === 'battery-test') { render(); drawBattChart(); } }
  if (kind === 'battTick') { BT.elapsed = p.elapsed; BT.target = p.target; status(`Test de batterie : ${Math.floor(p.elapsed/60)}:${String(p.elapsed%60).padStart(2,'0')} / ${BT.dur}:00`); if (view === 'battery-test' && !$('#btChart')) render(); else { const bar = document.querySelector('#content .progress i'); if (bar) bar.style.width = Math.min(100, Math.round(100 * p.elapsed / (p.target || 1))) + '%'; } }
  if (kind === 'battError') { BT.running = false; BT.error = p; status(p); renderTree(); if (view === 'battery-test') render(); }
  if (kind === 'battDone') { BT.running = false; BT.paused = false; BT.result = {...analyzeBatt(), seconds: p.seconds, stopped: p.stopped}; status('Test de batterie terminé' + (p.stopped ? ' (arrêté)' : '')); renderTree(); if (view === 'battery-test') render(); }
  if (kind === 'actionStep') { run.step = `Étape ${p.index + 1}/${p.count} — ${p.label}`; const el = $('#runStep'); if (el) el.textContent = run.step; status('Réparation : ' + run.step); }
  if (kind === 'actionLog') appendLog(p.id, p.line, p.replace);
  if (kind === 'actionDone') { const a = ACTIONS.find(x => x.id === p.id) || {title:p.id}; run.result[p.id] = p; run.id = null; done.push({id:p.id, title:a.title, ok:p.ok, at:new Date().toISOString()});
    appendLog(p.id, p.ok ? `— Terminé en ${p.seconds} s.${p.reboot ? ' Redémarrez le PC pour finaliser.' : ''}` : '— Interrompu.', false);
    if (p.ok && p.reboot && !QUEUE.active) rebootSuggested = true;
    status(`${a.title} : ${p.ok ? 'terminé' : 'échec ou annulé'}`); renderTree(); if (view === 'repair') render();
    if (QUEUE.active) queueOnDone(p); }
};
// ----- relevé des capteurs : enregistré dès le lancement, envoyé au site au format
// d'un relevé de surveillance HWiNFO, que le Diag Atelier affiche en courbes.
const LOG_MAX = 4 * 3600; // 4 h à une mesure par seconde, les plus anciennes sont oubliées
const LOG_COLS = [ // [colonne du Diag Atelier, en-tête HWiNFO, valeur depuis les capteurs de la seconde]
  ['ramUsedPct', 'Physical Memory Load [%]', v => v.id.ram],
  ['ramUsedMo', 'Physical Memory Used [MB]', v => has(v.id.ramUsed) ? Math.round(v.id.ramUsed * 1024) : null],
  ['ramAvailMo', 'Physical Memory Available [MB]', v => has(v.id.ramFree) ? Math.round(v.id.ramFree * 1024) : null],
  ['swapPct', 'Page File Usage [%]', v => v.id.pagef],
  ['cpuPct', 'Total CPU Usage [%]', v => v.id.cpu],
  ['cpuClock', 'Core Clocks (avg) [MHz]', v => v.id.cpuf],
  ['cpuTempAvg', 'Core Temperatures (avg) [°C]', v => v.k.cpuTempAvg],
  ['cpuTempMax', 'Core Max [°C]', v => v.k.cpuTempMax],
  ['cpuPower', 'CPU Package Power [W]', v => v.k.cpuPower],
  ['diskActivity', 'Total Activity [%]', v => v.id.disk],
  ['diskTemp', 'Drive Temperature [°C]', v => v.k.diskTemp],
  ['battCharge', 'Charge Level [%]', v => v.id.bat],
  ['gpuTemp', 'GPU Temperature [°C]', v => v.k.gpuTemp],
  ['gpuLoad', 'GPU Core Load [%]', v => has(v.k.gpuLoad) ? v.k.gpuLoad : v.id.gpu],
  ['gpuPower', 'GPU Power [W]', v => v.k.gpuPower],
  ['throttleCore', 'Core Thermal Throttling (avg) [Yes/No]', v => has(v.k.throttleCore) ? (v.k.throttleCore > 0 ? 'Yes' : 'No') : null],
  ['throttlePkg', 'Package/Ring Thermal Throttling [Yes/No]', v => has(v.k.throttlePkg) ? (v.k.throttlePkg > 0 ? 'Yes' : 'No') : null],
];
const SLOG = {start: Date.now(), rows: [], send: true};
function logSensors(list){
  const v = {id: {}, k: {}};
  list.forEach(x => { v.id[x.id] = x.v; if (x.k && !has(v.k[x.k])) v.k[x.k] = x.v; }); // première source par colonne (pilote de la carte, puis HWiNFO)
  if (!has(v.k.cpuTempAvg) && has(v.k.cpuTempMax)) v.k.cpuTempAvg = v.k.cpuTempMax; // AMD : une seule sonde (Tctl/Tdie)
  SLOG.rows.push([Date.now(), LOG_COLS.map(c => { const x = c[2](v); return has(x) ? x : null; })]);
  if (SLOG.rows.length > LOG_MAX) SLOG.rows.shift();
}
const logMinutes = () => SLOG.rows.length ? Math.max(1, Math.round((SLOG.rows[SLOG.rows.length - 1][0] - SLOG.rows[0][0]) / 60000)) : 0;
const logHasTemps = () => ['cpuTempMax', 'cpuTempAvg', 'gpuTemp'].some(k => { const i = LOG_COLS.findIndex(c => c[0] === k); return SLOG.rows.some(r => r[1][i] !== null); });
function sensorLogCSV(){
  if (SLOG.rows.length < 2) return null;
  const used = LOG_COLS.map((c, i) => SLOG.rows.some(r => r[1][i] !== null));
  const q = t => '"' + String(t).replace(/"/g, '""') + '"';
  const p2 = n => String(n).padStart(2, '0');
  const lines = ['Date,Time,' + LOG_COLS.filter((c, i) => used[i]).map(c => q(c[1])).join(',')];
  SLOG.rows.forEach(([t, vals]) => { const d = new Date(t);
    lines.push(`${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()},${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')},` +
      vals.filter((x, i) => used[i]).map(x => x === null ? '' : typeof x === 'number' ? String(Math.round(x * 100) / 100) : x).join(',')); });
  return lines.join('\r\n') + '\r\n';
}
const sensorLogName = () => { const d = new Date(SLOG.rows.length ? SLOG.rows[0][0] : Date.now()), p2 = n => String(n).padStart(2, '0');
  return `Releve_${(D && D.meta && D.meta.computer) || 'PC'}_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.csv`; };
function resetSensorLog(){ SLOG.rows = []; SLOG.start = Date.now(); }

function onSensors(list){
  logSensors(list);
  list.forEach(x => { let s = S[x.id];
    if (!s) { s = S[x.id] = {g:x.g, l:x.l, u:x.u, v:x.v, min:x.v, max:x.v, sum:0, n:0, h:[]}; sensOrder.push(x.id); if (view === 'sensors') setTimeout(renderSensorTable, 0); }
    s.v = x.v; s.min = Math.min(s.min, x.v); s.max = Math.max(s.max, x.v); s.sum += x.v; s.n++; s.h.push(x.v); if (s.h.length > 120) s.h.shift(); });
  const G = ['Processeur','Mémoire','Disques','Réseau','Carte graphique','Températures','Batterie','Système'];
  const gi = g => { const i = G.indexOf(g); return i >= 0 ? i : g.startsWith('Carte graphique') ? G.indexOf('Carte graphique') + .5 : G.length; };
  sensOrder.sort((a, b) => (gi(S[a].g) - gi(S[b].g)) || (S[a].g < S[b].g ? -1 : S[a].g > S[b].g ? 1 : 0));
  const f = (id, u) => S[id] ? fmtV(S[id].v, u) : '—';
  $('#sbCpu').textContent = f('cpu','%'); $('#sbRam').textContent = f('ram','%'); $('#sbDisk').textContent = f('disk','%');
  $('#sbNet').textContent = S.netR ? fmtV(S.netR.v + (S.netS ? S.netS.v : 0), 'Mbit/s') : '—';
  const t = Object.values(S).filter(s => s.g === 'Températures'); if (t.length) { $('#sbTempWrap').hidden = false; $('#sbTemp').textContent = fmtV(Math.max(...t.map(s => s.v)), '°C'); }
  if (view === 'sensors') { drawSensors(); const n = $('#logN'), d = $('#logDur'); if (n) n.textContent = SLOG.rows.length; if (d) d.textContent = logMinutes() + ' min'; }
  if (view === 'summary') drawMini();
  ['cpu','cpuf','bat'].forEach(id => { const el = document.getElementById('pv-' + id); if (el && S[id]) el.textContent = fmtV(S[id].v, S[id].u); });
}

function startScan(){ if (scanState && scanState.running) return; $('#bScan').disabled = true; scanState = {running:true, step:0, total:14, label:'Démarrage de la collecte…'}; status('Analyse en cours…'); api.scan(); if (view !== 'summary') go('summary'); else render(); }
$('#bScan').addEventListener('click', startScan);
(async () => {
  info = await api.info(); $('#pcName').textContent = info.computer; if (info.version) document.title = 'Planete-Computers 2.0 · PC2 Diag ' + info.version;
  const pill = $('#adminPill'); if (!info.admin) { pill.textContent = 'Mode limité'; pill.classList.add('limited'); pill.title = 'Sans droits administrateur : diagnostic partiel'; }
  try { ACTIONS = await api.actions(); } catch (_) {}
  try { CFG = await api.cfg() || {}; } catch (_) {}
  // nom du magasin : « Planete-Computers 2.0 », aussi pour les en-têtes enregistrés avec l'ancien nom
  if (!CFG.shop || /^plan[eèé]te[\s-]*computers(\s*2\.0)?$/i.test(CFG.shop.trim())) CFG.shop = 'Planete-Computers 2.0';
  try { SITE.state = await sapi.state(); } catch (_) {}
  await refreshHist();
  if (info.resumed) status('Reprise automatique après le redémarrage — nouvelle analyse en cours pour le comparatif avant/après.');
  renderTree(); render(); api.sensors(); startScan();
})();
window.addEventListener('resize', () => { if (view === 'disk-usage' && DU.tab === 'map') duDrawMap(); if (view === 'sensors') drawSensors(); if (view === 'summary') drawMini(); });
</script>
</body>
