      `<tr><td><b>${esc(r.action.label)}</b><div class="tk-sub">${esc(r.event.summary)}</div></td><td class="tk-link" data-tkopen="${r.ticket.id}"><b>#${r.ticket.id}</b> ${esc(r.ticket.title)}<div class="tk-sub">${tkBadge(r.ticket.status)} ${r.ticket.assignee_name ? esc(r.ticket.assignee_name) : 'Non attribué'}</div></td><td class="tk-sub">${fdt(r.event.happened_at)}<br>${esc(r.event.technician_name || '')}</td><td style="white-space:nowrap"><button class="btn go" data-tktodo="${r.ticket.id}:${r.event.id}:${r.action.index}">Fait</button></td></tr>`).join('') + '</tbody></table></div>';
  else body = !TK.list ? '' : !TK.list.length ? '<div class="empty">Aucun ticket ne correspond.</div>'
    : '<div style="overflow:auto"><table class="list tk-tbl"><thead><tr><th>Ticket</th><th>Client</th><th>Appareil</th><th>Statut</th><th>Priorité</th><th>Technicien</th><th>Mis à jour</th></tr></thead><tbody>' + TK.list.map(t =>
      `<tr class="tk-row" data-tkopen="${t.id}"><td><b>#${t.id}</b> ${esc(t.title)}${t.pending_actions ? ` <span class="cnt warn" title="Actions à faire">${t.pending_actions}</span>` : ''}</td><td>${esc(t.client || '—')}</td><td>${esc(t.device || '—')}</td><td>${tkBadge(t.status)}</td><td>${tkPrio(t.priority)}</td><td>${t.assignee ? esc(t.assignee.name) + (t.mine ? ' <span class="tk-sub">(vous)</span>' : '') : '<span class="tk-sub">Non attribué</span>'}</td><td class="tk-sub">${fdt(t.updated_at)}</td></tr>`).join('') + '</tbody></table></div>';
  const n = todo ? (TK.todos || []).length : (TK.list || []).length;
  return head('Tickets', `Les tickets du site PC2.0${TK.loading ? '' : ' · ' + n + (todo ? ' action(s)' : ' ticket(s)')}`, '<div style="display:flex;gap:8px"><button class="btn" id="tk-reload">Actualiser</button><button class="btn go" id="tk-new">Nouveau ticket pour ce PC</button></div>') +
    `<div class="stack">${chips}${search}${body}</div>`;
};

V.ticket = id => {
  id = +id;
  if (!tkPaired()) return tkPairMsg('Ticket #' + id);
  if (TK.cur !== id) { TK.cur = id; TK.d = null; setTimeout(() => tkLoad(id), 0); }
  const d = TK.d;
  if (!d) return head('Ticket #' + id) + (TK.dErr ? `<div class="banner">${esc(TK.dErr)} <button class="btn" id="tk-dreload">Réessayer</button> <button class="btn" data-nav="tickets">Retour à la liste</button></div>` : '<div class="empty">Chargement du ticket…</div>');
  const t = d.ticket;
  const sub = [LK.ticket && LK.ticket.id === t.id ? '<b>ticket de ce PC</b>' : '', t.client ? esc(t.client) : '', t.device ? esc(t.device) : '', 'créé le ' + fdt(t.created_at), 'mis à jour le ' + fdt(t.updated_at)].filter(Boolean).join(' · ');
  const right = `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-nav="tickets">Liste</button><button class="btn" id="tk-dreload"${TK.dLoading ? ' disabled' : ''}>${TK.dLoading ? 'Actualisation…' : 'Actualiser'}</button><button class="btn" data-surl="${esc(t.url)}">Ouvrir sur le site</button>${LK.ticket && LK.ticket.id === t.id ? '' : `<button class="btn" id="tk-linkpc"${t.status === 'resolved' || t.status === 'closed' ? ' disabled title="Ticket terminé"' : ''}>Rattacher ce PC</button>`}<button class="btn go" id="tk-sendscan">Envoyer l'analyse ici</button></div>`;
  const me = tkMe();
  const ctl = `<div class="card tk-ctl">
    <div><span class="tk-k">Statut</span><div class="seg tk-seg">${Object.keys(TST).map(s => `<button data-tkstatus="${s}" aria-pressed="${t.status === s}" class="${s}"${TK.busy ? ' disabled' : ''}>${TST[s]}</button>`).join('')}</div></div>
    <div><span class="tk-k">Priorité</span><div class="seg tk-seg">${Object.keys(TPR).map(p => `<button data-tkprio="${p}" aria-pressed="${t.priority === p}" class="${p}"${TK.busy ? ' disabled' : ''}>${TPR[p]}</button>`).join('')}</div></div>
    <div><span class="tk-k">Technicien</span><div>${t.assignee ? `<b>${esc(t.assignee.name)}</b>${t.mine ? ' (vous)' : ''}` : '<span style="color:var(--muted)">Non attribué</span>'} ${!t.assignee ? `<button class="btn go" id="tk-assign"${TK.busy ? ' disabled' : ''}>Me l'attribuer</button>` : ''}</div></div>
  </div>`;
  const active = d.timeline.filter(e => !e.is_removed);
  const tabs = [['fiche','Fiche'],['suivi','Suivi technicien', active.length],['chat','Échanges et notes', d.messages.length],['files','Fichiers', d.files.length],['diags','Diagnostics', d.diagnostics.length],['device','Appareil']];
  const tabbar = `<div class="seg du-tabs tk-tabs">${tabs.map(([k, l, n]) => `<button data-tktab="${k}" aria-pressed="${TK.tab === k}">${l}${n ? ` <span class="tk-n">${n}</span>` : ''}</button>`).join('')}</div>`;
  const flash = TK.flashErr ? `<div class="banner tk-flash">${esc(TK.flashErr)}</div>` : TK.flash ? `<div class="tk-ok tk-flash">${esc(TK.flash)}</div>` : '';
  const fn = {fiche: tkFiche, suivi: tkSuivi, chat: tkChat, files: tkFiles, diags: tkDiags, device: tkDevice}[TK.tab] || tkFiche;
  return head(`#${t.id} · ${t.title}`, sub, right) + `<div class="stack">${t.is_locked ? '<div class="banner">Ce ticket est verrouillé sur le site.</div>' : ''}${ctl}${tabbar}${flash}${fn(d, me)}</div>`;
};

function tkTodosOf(d){
  const out = [];
  d.timeline.forEach(e => { if (e.is_removed) return; ((e.details || {}).actions || []).forEach((a, i) => { if (a && a.label && !a.done) out.push({e, a, i}); }); });
  return out;
}
function tkFiche(d){
  const t = d.ticket, c = t.customer || {};
  const todos = tkTodosOf(d);
  const todoCard = todos.length ? `<div class="card"><h3 class="tk-h">À faire <span class="cnt warn">${todos.length}</span></h3>${todos.map(({e, a, i}) =>
    `<div class="tk-todo"><div><b>${esc(a.label)}</b><div class="tk-sub">${esc(e.summary)} · ${esc((e.technician || {}).name || '')} · ${fdt(e.happened_at)}</div></div><button class="btn go" data-tkact="${e.id}:${i}:1"${TK.busy ? ' disabled' : ''}>Fait</button></div>`).join('')}</div>` : '';
  const pwd = t.no_device_password ? 'Aucun (le client l\'a indiqué)' : t.device_password
    ? `<span class="mono">${TK.showPwd ? esc(t.device_password) : '••••••••'}</span> <button class="btn" id="tk-pwd">${TK.showPwd ? 'Masquer' : 'Afficher'}</button> <button class="btn" id="tk-pwdcopy">Copier</button>` : '<span style="color:var(--muted)">Non renseigné</span>';
  const main = props([['Demande', [
      ['Description', t.message ? `<div class="tk-pre">${esc(t.message)}</div>` : ''],
      ['Objets déposés', esc((t.brought_items || []).join(', '))],
      ['Mot de passe de session', pwd],
      ['Catégories', esc((t.categories || []).join(', '))],
      ['N° de facture', esc(t.invoice_id)],
      ['Devis Hiboutik', esc(t.hiboutik_quote_number)]]],
    ['Client', [
      ['Nom', esc(c.name)], ['Société', esc(c.company)],
      ['E-mail', c.email ? `${esc(c.email)}` : ''], ['Téléphone', esc(c.phone)], ['Adresse', esc(c.address)],
      ['Prévenu par', esc({Email:'E-mail', SMS:'SMS', None:'Ne pas prévenir'}[t.notify_by] || t.notify_by)],
      ['Note interne sur le client', c.internal_note ? `<div class="tk-pre tk-note">${esc(c.internal_note)}</div>` : '']]]]);
  const cmd = d.commandes.length ? `<div class="card"><h3 class="tk-h">Commandes</h3><table class="list"><thead><tr><th>Commande</th><th>Fournisseur</th><th>N°</th><th>Statut</th><th>Date</th></tr></thead><tbody>${d.commandes.map(x =>
    `<tr><td>${esc(x.nom)}</td><td>${esc(x.fournisseur || '—')}</td><td class="mono">${esc(x.command_number || '—')}</td><td>${esc(x.statut || '—')}</td><td class="tk-sub">${fdate(x.created_at)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const dv = d.devis.length ? `<div class="card"><h3 class="tk-h">Devis</h3><table class="list"><thead><tr><th>Devis</th><th>Statut</th><th>Hiboutik</th><th>Date</th><th></th></tr></thead><tbody>${d.devis.map(x =>
    `<tr><td>${esc(x.title || 'Devis #' + x.id)}</td><td>${esc(x.status)}</td><td class="mono">${esc(x.hiboutik_id || '—')}</td><td class="tk-sub">${fdate(x.created_at)}</td><td><button class="btn" data-surl="${esc(x.url)}">Ouvrir</button></td></tr>`).join('')}</tbody></table></div>` : '';
  return todoCard + main + cmd + dv;
}

// ----- suivi technicien
function tkEventForm(d){
  const f = TK.ev, o = d.options;
  return `<div class="card tk-form"><h3 class="tk-h">Ajouter au suivi</h3><div class="form">
    <label>Type d'événement<select data-tkev="event_type">${o.event_types.map(x => `<option value="${esc(x.eventType)}"${x.eventType === f.event_type ? ' selected' : ''}>${x.enabled ? '★ ' : ''}${esc(x.label || x.eventType)}</option>`).join('')}</select></label>
    <label>Date et heure (si ce n'est pas maintenant)<input type="datetime-local" data-tkev="happened_at" value="${esc(f.happened_at)}"></label>
    <label class="full">Résumé<input data-tkev="summary" maxlength="500" value="${esc(f.summary)}" placeholder="Ex : Diagnostic réalisé, alimentation HS"></label>
    <label class="full">Détails<textarea data-tkev="details" maxlength="3000" placeholder="Infos techniques, pièces changées, actions réalisées…">${esc(f.details)}</textarea></label>
    <div class="full"><div class="tk-k" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">Actions à réaliser
      <span style="display:flex;gap:6px">${o.action_lists.length ? `<select id="tk-evlist" class="tk-sel"><option value="">Charger une liste…</option>${o.action_lists.map(l => `<option value="${esc(l.key)}">${esc(l.label)} (${l.tasks.length})</option>`).join('')}</select>` : ''}<button class="btn" id="tk-evadd">+ Action</button></span></div>
      ${f.actions.length ? f.actions.map((a, i) => `<div class="tk-arow"><input data-tkevact="${i}" maxlength="160" value="${esc(a.label)}" placeholder="Ex : Remplacer le connecteur de charge"><label class="check"><input type="checkbox" data-tkevdone="${i}"${a.done ? ' checked' : ''}> Fait</label><button class="btn" data-tkevdel="${i}">Retirer</button></div>`).join('') : '<div class="tk-sub">Aucune action.</div>'}</div>
  </div><div class="ovl-acts"><button class="btn go" id="tk-evsave"${TK.busy ? ' disabled' : ''}>Ajouter au suivi</button><button class="btn" id="tk-evcancel">Annuler</button></div></div>`;
}
function tkPrefill(type){
  const tpl = TK.d.options.event_types.find(x => x.eventType === type);
  if (!tpl || !tpl.enabled) return;
  if (tpl.summary) TK.ev.summary = tpl.summary;
  if (tpl.details) TK.ev.details = tpl.details;
  TK.ev.actions = [];
}
function tkEventDetails(e){
  const x = e.details || {}, bits = [];
  if (x.note) bits.push(`<div class="tk-pre">${tkText(x.note)}</div>`);
  if (x.preview) bits.push(`<div class="tk-pre tk-sub">« ${tkText(x.preview)} »</div>`);
  if ('before' in x || 'after' in x) { const tr = v => esc(TST[v] || TPR[v] || (v === null || v === '' ? '—' : typeof v === 'object' ? JSON.stringify(v) : v)); bits.push(`<div class="tk-sub">${tr(x.before)} → <b>${tr(x.after)}</b></div>`); }
  if (x.files) bits.push(`<div class="tk-sub">${esc(x.files)}${x.email ? ' → ' + esc(x.email) : ''}</div>`);
  if (Array.isArray(x.prerequisites) && x.prerequisites.length) bits.push(`<ul class="tk-checks">${x.prerequisites.map(p => `<li class="${p.met ? 'ok' : ''}">${p.met ? '✓' : '○'} ${esc(p.name)}</li>`).join('')}</ul>`);
  if (Array.isArray(x.actions) && x.actions.length) bits.push(`<div class="tk-acts">${x.actions.map((a, i) => `<label class="tk-act${a.done ? ' done' : ''}"><input type="checkbox" data-tkact="${e.id}:${i}:${a.done ? 0 : 1}"${a.done ? ' checked' : ''}${e.is_removed || TK.busy ? ' disabled' : ''}> <span>${esc(a.label)}</span>${a.done && a.done_by_name ? `<small>${esc(a.done_by_name)}, ${fdt(a.done_at)}</small>` : ''}</label>`).join('')}</div>`);
  return bits.join('');
}
function tkSuivi(d){
  const list = d.timeline.filter(e => TK.showRemoved || !e.is_removed);
  const removed = d.timeline.length - d.timeline.filter(e => !e.is_removed).length;
  const tools = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${TK.ev ? '' : '<button class="btn go" id="tk-evnew">Ajouter au suivi</button>'}${removed ? `<label class="check"><input type="checkbox" id="tk-showrm"${TK.showRemoved ? ' checked' : ''}> Afficher les événements retirés (${removed})</label>` : ''}</div>`;
  const items = list.length ? `<div class="tk-tl">${list.map(e => {
    const rm = TK.removing === e.id;
    return `<div class="tk-ev${e.is_removed ? ' removed' : ''}${e.event_type.startsWith('commande_') ? ' cmd' : ''}">
      <div class="tk-evh"><span class="tk-type">${esc(tkEvLabel(e.event_type))}</span><b>${esc(e.summary)}</b><span class="tk-sub">${esc((e.technician || {}).name || 'Système')} · ${fdt(e.happened_at)}</span>
        <span class="spacer"></span>${e.is_removed ? `<button class="btn" data-tkrestore="${e.id}"${TK.busy ? ' disabled' : ''}>Restaurer</button>` : rm ? '' : `<button class="du-x" title="Retirer du suivi" data-tkremove="${e.id}">Retirer</button>`}</div>
      ${tkEventDetails(e)}
      ${e.is_removed ? `<div class="tk-sub">Retiré${e.removed_by ? ' par ' + esc(e.removed_by.name) : ''} le ${fdt(e.removed_at)}${e.removed_reason ? ' : ' + esc(e.removed_reason) : ''}</div>` : ''}
      ${rm ? `<div class="confirm"><input id="tk-rmreason" class="search" style="flex:1;margin:0" maxlength="500" placeholder="Raison (facultatif)" value="${esc(TK.removeReason)}"><button class="btn danger" id="tk-rmok"${TK.busy ? ' disabled' : ''}>Retirer du suivi</button><button class="btn" id="tk-rmcancel">Annuler</button></div>` : ''}
    </div>`; }).join('')}</div>` : '<div class="empty">Aucun événement dans le suivi pour le moment.</div>';
  return (TK.ev ? tkEventForm(d) : '') + tools + items;
}

// ----- échanges avec le client et notes internes
function tkChat(d, me){
  const o = d.options, dr = TK.draft, n = o.notification;
  if (dr.channel === null) dr.channel = n.default;
  const msgs = d.messages.length ? `<div class="tk-thread">${d.messages.map(m => {
    const mine = me.id && m.author && m.author.id === me.id, client = m.author && d.ticket.customer && m.author.id === d.ticket.customer.id;
    const kind = m.is_internal ? 'Note interne' : client ? 'Client' : 'Réponse au client';
    const dl = m.delivery || {}, sent = dl.status ? ` · ${dl.status === 'sent' ? 'envoyé' : dl.status === 'failed' ? 'échec de l\'envoi' : dl.status === 'skipped' ? 'non envoyé' : 'envoi en cours'}${dl.channel ? ' par ' + esc(dl.channel === 'Email' ? 'e-mail' : dl.channel) : ''}` : '';
    const mn = m.mention_notification || {};
    const del = 'msg' + m.id;
    return `<div class="tk-msg ${m.is_internal ? 'internal' : client ? 'client' : 'tech'}">
      <div class="tk-msgh"><b>${esc((m.author || {}).name || '?')}</b><span class="tk-kind">${kind}</span><span class="tk-sub">${fdt(m.created_at)}${sent}</span><span class="spacer"></span>
        ${m.is_internal && mn.exists && !mn.validated ? `<button class="btn" data-tkmention="${m.id}">Valider la mention</button>` : m.is_internal && mn.exists ? '<span class="tk-sub">Mention vue ✓</span>' : ''}
        ${mine ? `<button class="du-x${TK.confirm === del ? ' danger' : ''}" data-tkmsgdel="${m.id}">${TK.confirm === del ? 'Confirmer la suppression' : 'Supprimer'}</button>` : ''}</div>
      ${dl.status === 'failed' && dl.error ? `<div class="tk-sub" style="color:var(--crit)">${esc(dl.error)}</div>` : ''}
      <div class="tk-pre">${tkText(m.content)}</div>
      ${(m.file_attachments || []).length ? `<div class="tk-files">${m.file_attachments.map(f => `<button class="btn" data-tkfile="${esc(f.download_path)}">📎 ${esc(f.name)} <small>${tkSize(f.size)}</small></button>`).join('')}</div>` : ''}
    </div>`; }).join('')}</div>` : '<div class="empty">Aucun message sur ce ticket.</div>';
  const chans = [...n.channels, 'None'];
  const sms = !dr.internal && dr.channel === 'SMS';
  const comp = `<div class="card tk-compose ${dr.internal ? 'internal' : ''}">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg tk-seg"><button data-tkkind="0" aria-pressed="${!dr.internal}">Réponse au client</button><button data-tkkind="1" aria-pressed="${dr.internal}">Note interne</button></div>
      ${dr.internal ? '<span class="tk-sub">Visible des techniciens seulement. Tapez @ suivi du nom pour prévenir un collègue.</span>'
        : `<label class="tk-sub">Prévenir le client par <select id="tk-chan" class="tk-sel">${chans.map(c => `<option value="${c}"${dr.channel === c ? ' selected' : ''}>${{Email:'E-mail' + (n.email ? ' (' + esc(n.email) + ')' : ''), SMS:'SMS' + (n.phone ? ' (' + esc(n.phone) + ')' : ''), None:'Ne pas prévenir'}[c]}</option>`).join('')}</select></label>
          ${sms && o.sms_templates.length ? `<select id="tk-tpl" class="tk-sel"><option value="">Modèle de SMS…</option>${o.sms_templates.map((x, i) => `<option value="${i}"${String(i) === dr.tpl ? ' selected' : ''}>${esc(x.title || 'Modèle ' + (i + 1))}</option>`).join('')}</select>` : ''}`}</div>
    <textarea id="tk-text" maxlength="5000" placeholder="${dr.internal ? 'Note pour l\'équipe…' : 'Message au client…'}">${esc(dr.text)}</textarea>
    ${dr.internal && o.agents.length ? `<div class="chips">${o.agents.filter(a => a.mention && a.id !== me.id).map(a => `<button class="chip" data-tkat="${esc(a.mention)}">@${esc(a.name)}</button>`).join('')}</div>` : ''}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="btn">Joindre des fichiers<input type="file" id="tk-attach" multiple hidden></label>
      ${dr.files.map((f, i) => `<span class="tk-chipf">${esc(f.name)} <small>${tkSize(f.size)}</small> <button class="du-x" data-tkunattach="${i}">✕</button></span>`).join('')}
      <span class="spacer"></span>${sms ? `<span class="tk-sub" id="tk-smslen">${dr.text.length} / ${o.sms_max_length} caractères</span>` : ''}
      <button class="btn go" id="tk-sendmsg"${TK.busy ? ' disabled' : ''}>${dr.internal ? 'Ajouter la note' : dr.channel === 'None' ? 'Publier sans prévenir' : 'Envoyer au client'}</button></div>
    <div class="tk-sub">5 fichiers au plus, 6 Mo chacun (images, PDF, Office, texte, zip).</div>
  </div>`;
  return msgs + comp;
}

// ----- fichiers
function tkFiles(d){
  const L = d.file_limits || {};
  const sel = TK.mail ? TK.mail.ids : [];
  const up = `<div class="card"><h3 class="tk-h">Ajouter des fichiers au ticket</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label class="btn">Choisir des fichiers<input type="file" id="tk-upfiles" multiple hidden></label>
    ${TK.up.files.map((f, i) => `<span class="tk-chipf">${esc(f.name)} <small>${tkSize(f.size)}</small> <button class="du-x" data-tkunup="${i}">✕</button></span>`).join('')}
    <select id="tk-upvis" class="tk-sel"><option value="internal"${TK.up.vis === 'internal' ? ' selected' : ''}>Interne (techniciens)</option><option value="external"${TK.up.vis === 'external' ? ' selected' : ''}>Visible par le client</option></select>
    <button class="btn go" id="tk-upsend"${!TK.up.files.length || TK.busy ? ' disabled' : ''}>Ajouter</button></div>
    <div class="tk-sub">${L.max_count || 10} fichiers au plus, ${Math.round((L.max_kb || 20480) / 1024)} Mo chacun.</div></div>`;
  const rows = d.files.length ? `<div style="overflow:auto"><table class="list tk-tbl"><thead><tr><th></th><th>Fichier</th><th>Origine</th><th>Visibilité</th><th>Taille</th><th>Ajouté</th><th></th></tr></thead><tbody>${d.files.map(f => {
    const k = 'file' + f.id, own = f.source === 'ticket';
    return `<tr><td>${own ? `<input type="checkbox" data-tkmailpick="${f.id}"${sel.includes(f.id) ? ' checked' : ''}>` : ''}</td><td><b>${esc(f.name)}</b>${f.last_sent_to ? `<div class="tk-sub">Envoyé à ${esc(f.last_sent_to)} le ${fdt(f.last_sent_at)}</div>` : ''}</td><td>${TSRC[f.source] || esc(f.source)}</td>
      <td>${f.visibility === 'external' ? '<span class="tk-vis ext">Client</span>' : '<span class="tk-vis">Interne</span>'}</td><td class="tk-sub">${tkSize(f.size)}</td><td class="tk-sub">${fdt(f.created_at)}${f.uploaded_by ? '<br>' + esc(f.uploaded_by) : ''}</td>
      <td style="white-space:nowrap"><button class="btn" data-tkfile="${esc(f.download_path)}">Ouvrir</button>${own ? ` <button class="btn" data-tkvis="${f.id}:${f.visibility === 'external' ? 'internal' : 'external'}"${TK.busy ? ' disabled' : ''}>${f.visibility === 'external' ? 'Rendre interne' : 'Montrer au client'}</button> <button class="btn${TK.confirm === k ? ' danger' : ''}" data-tkfdel="${f.id}"${TK.busy ? ' disabled' : ''}>${TK.confirm === k ? 'Confirmer' : 'Supprimer'}</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Aucun fichier sur ce ticket.</div>';
  const mail = TK.mail ? `<div class="card"><h3 class="tk-h">Envoyer ${sel.length} fichier(s) au client par e-mail</h3><div class="form">
      <label>Adresse<input id="tk-mailto" type="email" value="${esc(TK.mail.email)}"></label><div></div>
      <label class="full">Message (facultatif)<textarea id="tk-mailmsg" maxlength="5000">${esc(TK.mail.message)}</textarea></label></div>
      <div class="tk-sub">Les fichiers envoyés deviennent visibles par le client sur sa page du ticket.</div>
      <div class="ovl-acts"><button class="btn go" id="tk-mailsend"${!sel.length || TK.busy ? ' disabled' : ''}>Envoyer</button><button class="btn" id="tk-mailcancel">Annuler</button></div></div>`
    : d.files.some(f => f.source === 'ticket') ? '<div><button class="btn" id="tk-mailnew">Envoyer des fichiers au client par e-mail</button></div>' : '';
  return up + rows + mail;
}

// ----- diagnostics
function tkDiags(d){
  const lv = {good:'ok', warn:'warn', crit:'crit'};
  const rows = d.diagnostics.length ? `<div style="overflow:auto"><table class="list tk-tbl"><thead><tr><th>Date</th><th>Poste</th><th>État</th><th>Viabilité</th><th>Technicien</th><th>Client</th><th></th></tr></thead><tbody>${d.diagnostics.map(x =>
    `<tr><td class="tk-sub">${fdt(x.created_at)}</td><td>${esc(x.machine_name || '—')}</td><td>${x.overall ? st(lv[x.overall] || 'info', esc(x.overall_label || x.overall)) : '—'}</td><td>${x.viability_score != null ? x.viability_score + '/100' : '—'}${x.viability_label ? `<div class="tk-sub">${esc(x.viability_label)}</div>` : ''}</td><td>${esc(x.technician || '—')}</td>
      <td><label class="check"><input type="checkbox" data-tkdvis="${x.id}"${x.client_visible ? ' checked' : ''}${TK.busy ? ' disabled' : ''}> Visible</label></td>
      <td style="white-space:nowrap"><button class="btn" data-surl="${esc(x.report_url)}">Ouvrir sur le site</button> <button class="btn" data-tkfile="${esc(x.client_report_path)}">Fiche client</button>${x.app_scan_path ? ` <button class="btn go" data-tkreopen="${x.id}" title="Problèmes, matériel, Windows, rapport client : comme si l'analyse venait d'être faite">Rouvrir dans l'appli</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Aucun diagnostic sur ce ticket.</div>';
  return `<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1">L'analyse de ce PC part sur ce ticket avec le Diag atelier : rapport, fiche appareil complétée, tests manuels et relevé des capteurs.</div><button class="btn go" id="tk-sendscan">Envoyer l'analyse ici</button></div>` + rows;
}

// ----- appareil
function tkDevice(d){
  const v = d.ticket.device_info;
  if (!v) return '<div class="empty">Aucun appareil n\'est lié à ce ticket. L\'envoi d\'une analyse sur le ticket crée sa fiche.</div>';
  const f = TK.dev;
  const form = f ? `<div class="card tk-form"><h3 class="tk-h">Ajouter une intervention sur l'appareil</h3><div class="form">
      <label>Type<select data-tkdev="event_type">${Object.keys(TDEV).map(k => `<option value="${k}"${f.event_type === k ? ' selected' : ''}>${TDEV[k]}</option>`).join('')}</select></label>
      <label>Date et heure (si ce n'est pas maintenant)<input type="datetime-local" data-tkdev="happened_at" value="${esc(f.happened_at)}"></label>
      <label class="full">Résumé<input data-tkdev="summary" maxlength="500" value="${esc(f.summary)}" placeholder="Ex : Batterie remplacée par une neuve"></label>
      <label class="full">Détails<textarea data-tkdev="details" maxlength="3000">${esc(f.details)}</textarea></label></div>
      <div class="ovl-acts"><button class="btn go" id="tk-devsave"${TK.busy ? ' disabled' : ''}>Ajouter</button><button class="btn" id="tk-devcancel">Annuler</button></div></div>`
    : '<div><button class="btn go" id="tk-devnew">Ajouter une intervention</button></div>';
  const evs = d.device_events.length ? `<div class="tk-tl">${d.device_events.map(e => `<div class="tk-ev"><div class="tk-evh"><span class="tk-type">${esc(TDEV[e.event_type] || e.event_type)}</span><b>${esc(e.summary)}</b><span class="tk-sub">${esc(e.technician || '')} · ${fdt(e.happened_at)}${e.ticket_id && e.ticket_id !== d.ticket.id ? ' · ticket #' + e.ticket_id : ''}</span></div>${e.note ? `<div class="tk-pre">${esc(e.note)}</div>` : ''}</div>`).join('')}</div>` : '<div class="empty">Aucune intervention enregistrée sur cet appareil.</div>';
  return props([['', [['Appareil', esc(v.name)], ['Type', esc(TDTYPE[v.type] || v.type)], ['Marque', esc(v.brand)], ['Modèle', esc(v.model)], ['N° de série', v.serial_number ? `<span class="mono">${esc(v.serial_number)}</span>` : ''], ['N° de suivi', esc(v.asset_tag)], ['Achat', v.purchase_date ? fdate(v.purchase_date) : ''], ['Fin de garantie', v.warranty_end_date ? fdate(v.warranty_end_date) : '']]]]) +
    `<div><button class="btn" data-surl="${esc(v.url)}">Ouvrir la fiche appareil sur le site</button></div>` + form + `<h3 class="tk-h" style="margin:4px 0 0">Historique de l'appareil</h3>` + evs;
}

  const fd = t.closest('[data-tkfdel]');
  if (fd) { const k = 'file' + fd.dataset.tkfdel; if (TK.confirm !== k) { TK.confirm = k; render(); return; } tkDo(tkapi.call('DELETE', `${P}/files/${fd.dataset.tkfdel}`), 'Fichier supprimé.'); return; }
  if (t.id === 'tk-mailnew') { TK.mail = {ids: [], email: (TK.d.ticket.customer || {}).email || '', message: ''}; render(); return; }
  if (t.id === 'tk-mailcancel') { TK.mail = null; render(); return; }

  if (t.id === 'tk-devcancel') { TK.dev = null; render(); return; }

    if (await tkDo(tkapi.call('POST', P + '/device-events', {event_type: f.event_type, summary: f.summary.trim(), details: f.details.trim() || null, happened_at: tkUTC(f.happened_at)}), 'Intervention ajoutée.')) { TK.dev = null; render(); } return; }
});

// ===================== suivi du PC sur son ticket =====================
// Le ticket ouvert pour ce PC est retrouvé sur le site (n° de série de
// l'appareil du ticket, d'un diagnostic envoyé ou d'un suivi précédent de
// l'application, sinon le nom du PC) ; sans certitude, on le demande au
// technicien. Ce qu'il fait ensuite dans l'application (analyses,
// réparations, tests, rapports, redémarrages, notes) s'écrit dans le suivi
// technicien du ticket. Ce qui n'est pas encore parti est gardé dans
// PC2Diag-rapports\Suivi et repart dès que le site répond, même après un
// redémarrage.
const LK = {ticket:null, serial:'', off:false, queue:[], log:[], pending:[], machine:{}, started:new Date().toISOString(),
  looked:false, asked:false, busy:false, err:'', cands:null, q:'', found:null, searching:false, sessionFor:0, flushing:false,
  timer:null, retry:null, wait:60, tests:{}, testsTimer:null, ovl:null};
const LKBY = {device:'n° de série de l\'appareil du ticket', diagnostic:'n° de série d\'un diagnostic du ticket', app:'déjà suivi par PC2 Diag sur ce ticket', name:'même nom de PC', last:'le rattachement de la dernière fois sur ce PC', client:'autre ticket ouvert du même client'};
const lkUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const lkT = t => ({id: t.id, title: t.title, client: t.client || '', device: t.device || ''});
const lkTime = iso => new Date(iso).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
function lkMachine(){ // ce PC-ci, même quand un diag d'un autre PC est rouvert
  const m = HOST || {};
  return {serial: m.serial || '', computer: m.computer || info.computer || '', model: HOST ? [maker(m), m.model].filter(Boolean).join(' ') : ''};
}
const lkIdLine = m => [m.computer, m.model, m.serial ? 'n° de série ' + m.serial : ''].filter(Boolean).join(' · ');
function lkSave(){ try { goLinkSave({ticket: LK.ticket, serial: LK.serial, off: LK.off, queue: LK.queue}).catch(() => {}); } catch (_) {} }
async function lkRestore(){
  let s = null;
  try { s = await goLinkGet(); } catch (_) {}
  if (s) { LK.ticket = s.ticket || null; LK.serial = s.serial || ''; LK.off = !!s.off; LK.queue = arr(s.queue); }
  LK.machine = lkMachine();
  lkPaint();
  if (LK.queue.length && tkPaired()) lkFlush(); // ce qui n'était pas parti avant la fermeture ou le redémarrage
}
// Après l'analyse, on sait quel PC c'est : on cherche son ticket.
function lkIdentify(){
  const m = lkMachine();
  if (LK.serial && m.serial && LK.serial.toUpperCase() !== m.serial.toUpperCase()) { LK.ticket = null; LK.off = false; LK.sessionFor = 0; } // autre PC du même nom
  LK.machine = m; if (m.serial) LK.serial = m.serial;
  lkSave();
  if (!LK.looked) lkLookup();
}
async function lkLookup(){
  if (!tkPaired() || LK.busy || !LK.machine.computer) return;
  const m = LK.machine;
  LK.busy = true; LK.err = ''; lkPaint();
  let r;
  try { r = await tkapi.call('GET', '/tickets/for-machine?serial=' + encodeURIComponent(m.serial || '') + '&computer=' + encodeURIComponent(m.computer || '') + (LK.ticket ? '&ticket=' + LK.ticket.id : '')); }
  catch (err) { LK.busy = false; LK.err = 'Recherche du ticket de ce PC impossible : ' + err; lkPaint(); return; }
  LK.busy = false; LK.looked = true; LK.cands = r.tickets || []; LK.others = r.client_tickets || [];
  if (LK.ticket) {
    // PC déjà vu : si le client a d'autres tickets ouverts, on demande lequel est le bon plutôt que de reprendre l'ancien
    // (sauf à la reprise après un redémarrage, au milieu d'une intervention)
    if (r.current && r.current.open && (!LK.others.length || info.resumed)) { LK.ticket = lkT(r.current); lkSave(); lkSessionStart('restored'); lkPaint(); return; }
    if (r.current && r.current.open) {
      LK.cands = [{...r.current, match: {by: 'last', strong: true}}].concat(LK.cands.filter(t => t.id !== r.current.id));
      LK.ticket = null; LK.sessionFor = 0; lkSave(); lkPaint(); LK.asked = true; lkPanel(); return;
    }
    status(r.current ? `Le ticket #${LK.ticket.id} est ${(TST[r.current.status] || r.current.status).toLowerCase()} : ce PC n'y est plus rattaché.` : `Le ticket #${LK.ticket.id} n'existe plus : ce PC n'y est plus rattaché.`);
    LK.ticket = null; LK.sessionFor = 0; lkSave();
  }
  if (LK.off) { lkPaint(); return; }
  const strong = LK.cands.filter(t => t.match && t.match.strong);
  if (strong.length === 1 && !LK.others.length) { lkLink(strong[0], 'auto'); return; }
  lkPaint();
  if (!LK.asked) { LK.asked = true; lkPanel(); }
}
function lkLink(t, how){
  if (LK.ticket && LK.ticket.id !== t.id) LK.sessionFor = 0;
  LK.ticket = lkT(t); LK.off = false; lkSave();
  if (!SITE.quick && (!SITE.ticket || how !== 'auto')) SITE.ticket = {...LK.ticket};
  status(`Ce PC est rattaché au ticket #${t.id} : ce que vous faites ici s'inscrit dans son suivi technicien.`);
  lkSessionStart(how, t.match);
  lkPaint();
}
function lkUnlink(off){
  LK.ticket = null; LK.off = !!off; LK.sessionFor = 0; LK.pending = []; lkSave();
  status(off ? 'Ce PC ne sera pas suivi sur un ticket.' : 'Ce PC n\'est plus rattaché à un ticket.');
  lkPaint();
}
// Première entrée de la session sur le ticket, puis ce qui a été fait avant le rattachement.
function lkSessionStart(how, match){
  if (!LK.ticket || LK.sessionFor === LK.ticket.id) return;
  LK.sessionFor = LK.ticket.id;
  const note = [lkIdLine(LK.machine), how === 'auto' ? 'Ticket retrouvé automatiquement : ' + (LKBY[match && match.by] || 'n° de série') + '.' : how === 'pick' ? 'Ticket choisi par le technicien.' : how === 'restored' ? 'PC déjà rattaché à ce ticket lors d\'une session précédente.' : how === 'created' ? 'Ticket créé depuis PC2 Diag.' : '',
    info.version ? 'PC2 Diag ' + info.version + (info.admin ? '' : ', sans droits administrateur') + '.' : ''].filter(Boolean).join('\n');
  lkQueue({uid: lkUid(), kind: 'session', summary: info.resumed ? 'PC2 Diag relancé sur le PC après le redémarrage' : 'PC2 Diag lancé sur le PC du client', note, happened_at: LK.started});
  LK.pending.splice(0).forEach(lkQueue);
}
// Une chose faite par le technicien : vers le suivi du ticket rattaché.
function lkNote(kind, summary, lines){
  const note = arr(lines).filter(Boolean).join('\n');
  const e = {uid: lkUid(), kind, summary: String(summary).slice(0, 500), note: note ? note.slice(0, 3000) : null, happened_at: new Date().toISOString()};
  if (LK.ticket) lkQueue(e);
  else if (!LK.off && LK.pending.length < 40) { LK.pending.push(e); lkPaint(); }
}
function lkQueue(e){
  LK.queue.push({t: LK.ticket.id, m: LK.machine, e});
  LK.log.unshift({...e, t: LK.ticket.id, sent: false});
  lkSave(); lkPaint();
  clearTimeout(LK.timer); LK.timer = setTimeout(lkFlush, 1500);
}
async function lkFlush(){
  if (LK.flushing || !LK.queue.length || !tkPaired()) return;
  LK.flushing = true; clearTimeout(LK.retry);
  try {
    while (LK.queue.length) {
      const first = LK.queue[0], key = JSON.stringify(first.m);
      const batch = LK.queue.filter(q => q.t === first.t && JSON.stringify(q.m) === key).slice(0, 50);
      await tkapi.call('POST', `/tickets/${first.t}/activity`, {machine: first.m, entries: batch.map(q => q.e)});
      const sent = new Set(batch.map(q => q.e.uid));
      LK.queue = LK.queue.filter(q => !sent.has(q.e.uid));
      LK.log.forEach(l => { if (sent.has(l.uid)) l.sent = true; });
      lkSave();
      if (view === 'ticket:' + first.t && TK.cur === first.t && !TK.busy) tkLoad(first.t, true);
    }
    LK.err = ''; LK.wait = 60;
  } catch (err) {
    let why = String(err);
    const t = LK.queue.length ? LK.queue[0].t : 0;
    // « introuvable » : le ticket a disparu, ou le site n'a pas encore l'adresse du suivi (site pas à jour)
    if (t && /introuvable sur le site/.test(why)) {
      let exists = false; try { await tkapi.call('GET', `/tickets/${t}`); exists = true; } catch (_) {}
      why = exists ? `le ticket #${t} existe, mais le site ne connaît pas encore le suivi de PC2 Diag : il doit être mis à jour (déploiement de main, puis php artisan optimize:clear et route:cache)`
        : `le ticket #${t} est introuvable sur le site : rattachez le PC à un autre ticket et abandonnez les entrées en attente`;
    }
    LK.err = 'Suivi pas encore envoyé (' + why + '). Nouvel essai dans ' + Math.round(LK.wait / 60) + ' min.';
    LK.retry = setTimeout(lkFlush, LK.wait * 1000); LK.wait = Math.min(LK.wait * 2, 900);
  }
  LK.flushing = false; lkPaint();
}
// Les tests manuels s'enchaînent : un seul résumé, une minute après le dernier verdict.
function lkTest(id){
  LK.tests[id] = TESTS.checks[id] || '';
  clearTimeout(LK.testsTimer); LK.testsTimer = setTimeout(lkTestsDone, 60000);
}
function lkTestsDone(){
  clearTimeout(LK.testsTimer);
  const ids = Object.keys(LK.tests); if (!ids.length) return;
  const lbl = id => (TESTS.list.find(c => c.id === id) || {}).label || id;
  const okN = ids.filter(id => LK.tests[id] === 'ok').length, koN = ids.filter(id => LK.tests[id] === 'ko').length;
  lkNote('tests', `Tests manuels : ${okN} OK, ${koN} KO`, ids.map(id => `${lbl(id)} : ${LK.tests[id] === 'ok' ? 'OK' : LK.tests[id] === 'ko' ? 'KO' : 'verdict retiré'}`));
  LK.tests = {};
}
function lkScanDone(seconds){
  const n = sev => F.filter(f => f.sev === sev).length;
  const lines = F.filter(f => f.sev !== 'info').sort((a, b) => ORDER[a.sev] - ORDER[b.sev]).slice(0, 15).map(f => `[${SEVL[f.sev]}] ${f.title}`);
  if (F.filter(f => f.sev !== 'info').length > 15) lines.push('…');
  if (seconds) lines.push(`Analyse faite en ${seconds} s${info.admin ? '' : ' (sans droits administrateur : partielle)'}.`);
  lkNote('scan', `${SESSION.length > 1 ? 'Nouvelle analyse' : 'Analyse'} du PC : ${LV[levelOf(F)].t.toLowerCase()} (${n('crit')} critique(s), ${n('warn')} à corriger, ${n('info')} conseil(s))`, lines);
}
function lkBattery(r){
  const h = battHealth();
  const lines = [r.seconds ? `Durée du test : ${Math.max(1, Math.round(r.seconds / 60))} min${r.stopped ? ' (arrêté avant la fin)' : ''}.` : '',
    r.avgW ? `Consommation moyenne : ${wfmt(r.avgW)}.` : '', r.runtimeH ? `Autonomie estimée : ${(+r.runtimeH).toFixed(1).replace('.', ',')} h.` : '', ...arr(r.anomalies)];
  lkNote('battery', `Test de batterie : ${h != null ? 'santé ' + h + ' % — ' + battVerdict(h)[1].toLowerCase() : r.ok ? 'pas d\'anomalie' : 'anomalies relevées'}`, lines);
}
function lkBeforeReboot(resume){
  lkTestsDone();
  lkNote('reboot', 'Redémarrage du PC lancé depuis PC2 Diag', resume ? 'PC2 Diag se relance après le redémarrage.' : '');
}

  sbWho();

  b.classList.toggle('lk-none', !LK.ticket && !LK.off);
  b.querySelector('span').textContent = LK.ticket ? 'Ticket #' + LK.ticket.id : LK.busy ? 'Recherche du ticket…' : LK.off ? 'PC non suivi' : 'Ticket du PC ?';
  b.title = LK.ticket ? `Ce PC est rattaché au ticket #${LK.ticket.id} — ${LK.ticket.title}` : 'Rattacher ce PC à son ticket';

  if (LK.ovl && LK.ovl.o.isConnected) lkPanelRender();
}
function lkPanel(){
  LK.asked = true;
  if (LK.ovl && LK.ovl.o.isConnected) return;
  if (LK.ticket === null && !LK.cands && !LK.busy && tkPaired()) lkLookup();
  LK.ovl = overlay('<div class="ovl-box wide lk-box" style="user-select:text"></div>', {onClose: () => { LK.ovl = null; LK.changing = false; LK.found = null; LK.nt = null; }});
  lkPanelRender();
  if (!LK.ticket && tkPaired()) lkSearch(); // les tickets ouverts, pour choisir sans rien taper
}

async function lkSearch(){
  LK.q = ($('#lk-q') || {}).value || ''; LK.searching = true; lkPanelRender();
  try { LK.found = ((await tkapi.call('GET', '/tickets?scope=open&q=' + encodeURIComponent(LK.q.trim()))) || {}).tickets || []; } catch (err) { LK.found = []; LK.err = String(err); }
  LK.searching = false; lkPanelRender();
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#bLink')) { lkPanel(); return; }
  if (!t.closest('.lk-box')) return;
  const ln = t.closest('[data-lklink]');
  if (ln) { const id = +ln.dataset.lklink, tk = [...(LK.cands || []), ...arr(LK.others), ...(LK.found || [])].find(x => x.id === id); if (tk) { LK.changing = false; LK.found = null; lkLink(tk, 'pick'); } return; }
  if (t.id === 'lk-search') { lkSearch(); return; }
  if (t.id === 'lk-new') { ntStart(); lkPanelRender(); return; }
  if (t.id === 'lk-change') { LK.changing = true; lkSearch(); return; }
  if (t.id === 'lk-unlink') { lkUnlink(false); return; }
  if (t.id === 'lk-off') { lkUnlink(true); LK.ovl && LK.ovl.close(); return; }
  if (t.id === 'lk-retry') { LK.err = ''; LK.wait = 60; if (LK.queue.length) lkFlush(); else { LK.looked = false; lkLookup(); } return; }
  if (t.id === 'lk-drop') { LK.queue = []; LK.err = ''; lkSave(); lkPaint(); return; }
  if (t.id === 'lk-addnote') { const v = $('#lk-note').value.trim(); if (!v) return; $('#lk-note').value = ''; lkNote('note', v.length > 160 ? v.slice(0, 157) + '…' : v, v.length > 160 ? v : ''); status('Note ajoutée au suivi du ticket #' + LK.ticket.id + '.'); return; }
  const op = t.closest('[data-tkopen]'); if (op) tkOpen(op.dataset.tkopen);
});
document.addEventListener('keydown', e => { if (e.target.id === 'lk-q' && e.key === 'Enter') lkSearch(); });

async function ntCreate(){
  const n = LK.nt, m = n.machine;
  if (n.sel === 'existing' && !n.user) { n.err = 'Choisissez le client, ou passez sur « Nouveau client ».'; lkPanelRender(); return; }
  if (n.sel === 'new' && !n.first.trim()) { n.err = 'Indiquez au moins le prénom du nouveau client.'; lkPanelRender(); return; }
  if (!n.title.trim()) { n.err = 'Indiquez un titre.'; lkPanelRender(); return; }
  if (!n.nopwd && !n.pwd.trim()) { n.err = 'Indiquez le mot de passe, ou cochez « Pas de mot de passe ».'; lkPanelRender(); return; }
  if (n.nopwd && !n.nopwdOk) { n.err = 'Confirmez que le client n\'a pas de mot de passe.'; lkPanelRender(); return; }
  const other = n.other.split(',').map(x => x.trim()).filter(Boolean).slice(0, 10);
  const body = {user_selection: n.sel, title: n.title.trim(), message: n.message.trim() || null, priority: n.priority, assign_to_me: n.assign,
    brought_items: other.length ? [...n.items, 'other'] : n.items, brought_other_items: other,
    device_password: n.nopwd ? null : n.pwd, no_device_password: n.nopwd, password_empty_confirmed: n.nopwd && n.nopwdOk,
    notify_by: ntBoth(n) ? (n.notify || 'Email') : null, category_id: n.category ? +n.category : null,
    machine: {brand: (HOST && maker(HOST)) || '', model: (HOST && HOST.model) || '', serial: m.serial || ''}};
  if (n.sel === 'existing') body.user_id = n.user.id;
  else Object.assign(body, {user_first_name: n.first.trim(), user_last_name: n.last.trim(), user_email: n.email.trim() || null, user_phone: n.phone.trim(), user_address: n.address.trim(), user_postal_code: n.postal.trim(), user_city: n.city.trim()});
  n.sending = true; n.err = ''; lkPanelRender();
  try {
    const r = await tkapi.call('POST', '/tickets', body);
    LK.nt = null; LK.found = null; LK.changing = false;
    lkLink(r.ticket, 'created');
    status(r.message + ' Ce PC y est rattaché.' + arr(r.warnings).map(w => ' ' + w).join(''));
    TK.list = null;
  } catch (err) { n.sending = false; n.err = String(err); lkPanelRender(); }
}
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.nt; if (k && LK.nt) LK.nt[k] = e.target.value; });
document.addEventListener('change', e => { const t = e.target; if (!LK.nt || !t.dataset) return;
  if (t.dataset.nt) LK.nt[t.dataset.nt] = t.value;
  if (t.dataset.ntitem) { const k = t.dataset.ntitem; LK.nt.items = t.checked ? [...new Set([...LK.nt.items, k])] : LK.nt.items.filter(x => x !== k); }
  if (t.dataset.ntcheck) { LK.nt[t.dataset.ntcheck] = t.checked; if (t.dataset.ntcheck === 'nopwd') { if (!t.checked) LK.nt.nopwdOk = false; lkPanelRender(); } } });
document.addEventListener('click', e => { const t = e.target; if (!LK.nt || !t.closest('.lk-box')) return;
  const s = t.closest('[data-ntsel]'); if (s) { LK.nt.sel = s.dataset.ntsel; LK.nt.err = ''; lkPanelRender(); return; }
  const p = t.closest('[data-ntpick]'); if (p) { LK.nt.user = arr(LK.nt.customers).find(c => c.id === +p.dataset.ntpick) || null; LK.nt.err = ''; lkPanelRender(); return; }
  if (t.id === 'nt-unpick') { LK.nt.user = null; lkPanelRender(); return; }
  if (t.id === 'nt-search') { ntSearch(); return; }
  if (t.id === 'nt-cancel') { LK.nt = null; lkPanelRender(); return; }
  if (t.id === 'nt-create') ntCreate(); });
document.addEventListener('keydown', e => { if (e.target.id === 'nt-q' && e.key === 'Enter') ntSearch(); });

// ===================== diag d'un ticket rouvert =====================
// Un diagnostic enregistré sur un ticket (fait sur un autre PC) se rouvre ici
// comme une analyse : problèmes, matériel, Windows, Diag atelier, rapport
// client. Les réparations restent masquées (elles s'appliqueraient à ce
// PC-ci) et l'envoi au site aussi ; « Revenir à ce PC » remet l'analyse locale.
let HOST = null; // le PC où tourne l'application (sa dernière analyse)
const IMP = {on:false, ticket:0, id:0, label:'', backup:null};
async function impOpen(x, ticketId){
  if (!x || !x.app_scan_path) return;
  status('Ouverture du diagnostic #' + x.id + '…');
  let data;
  try { data = await goSiteLoadDiag(x.app_scan_path); }
  catch (err) { status(String(err)); TK.flashErr = String(err); render(); return; }
  if (!IMP.on) IMP.backup = {D, F: F.slice(), OK: OK.slice(), excl: [...EXCL]};
  const m = data.meta || {};
  Object.assign(IMP, {on: true, ticket: ticketId, id: x.id,
    label: `Diagnostic du ticket #${ticketId} : ${m.computer || x.machine_name || 'autre PC'}${m.model ? ' (' + [maker(m), m.model].filter(Boolean).join(' ') + ')' : ''}, analysé le ${fdt(m.scanDate || x.created_at)}${x.technician ? ', envoyé par ' + x.technician : ''}`});
  D = data; F.length = 0; OK.length = 0; EXCL.clear(); rules(D); ATL.cur = undefined;
  status(IMP.label + '.');
  renderTree(); go('summary');
}
function impLeave(){
  if (!IMP.on) return;
  const b = IMP.backup; IMP.on = false; IMP.backup = null;
  D = b.D; F.length = 0; OK.length = 0; F.push(...b.F); OK.push(...b.OK); EXCL.clear(); b.excl.forEach(k => EXCL.add(k)); ATL.cur = undefined;
  status(D ? 'Retour à l\'analyse de ce PC.' : 'Retour à ce PC : il n\'a pas encore été analysé.');
  renderTree(); go(D ? 'summary' : 'ticket:' + IMP.ticket);
}
const impBanner = () => `<div class="banner imp-ban"><div style="flex:1;min-width:260px"><b>${esc(IMP.label)}</b><div class="tk-sub">Diagnostic rouvert en lecture seule : les réparations sont masquées, elles s'appliqueraient à ce PC-ci.</div></div><button class="btn" data-tkopen="${IMP.ticket}">Voir le ticket</button> <button class="btn go" data-impleave>Revenir à ce PC</button></div>`;
document.addEventListener('click', e => { if (e.target.closest('[data-impleave]')) impLeave(); });

// ===================== évènements du programme =====================
function status(t){ $('#stMsg').textContent = t; }
window.onGo = (kind, p) => {
  if (kind === 'site') { SITE.state = p; if (view === 'site') render(); lkPaint(); if (tkPaired()) { if (D && !LK.looked) lkLookup(); lkFlush(); } }
  if (kind === 'scanProgress') { scanState = {running:true, ...p}; status(`Analyse ${p.step}/${p.total} — ${p.label}`); if (view === 'summary') { const lb = document.querySelector('.scanning .lbl'); if (lb) { lb.innerHTML = `<span>${esc(p.label)}</span><span class="mono">${p.step}/${p.total}</span>`; document.querySelector('.scanning .progress i').style.width = Math.round(100 * p.step / p.total) + '%'; const sl = document.querySelector('.scanning .scanslow'); if (sl) sl.innerHTML = scanSlow(); } else render(); } }
  if (kind === 'scanDone') { HOST = (p.data && p.data.meta) || null; if (IMP.on) { IMP.on = false; IMP.backup = null; ATL.cur = undefined; } SESSION.push({file: p.file || ('session-' + (SESSION.length + 1)), date: new Date().toISOString(), data: p.data}); beforeSel = null; refreshHist().then(() => { if (view === 'report') render(); }); D = p.data; SITE.file = ''; SITE.result = null; if (ATL.ready || view === 'atelier') atelierSync(); scanState = null; $('#bScan').disabled = false; F.length = 0; OK.length = 0; rules(D); status(`Analyse terminée en ${p.seconds} s — ${F.length} constat(s)`); renderTree(); render(); lkIdentify(); lkScanDone(p.seconds); }
  if (kind === 'scanError') { scanState = {error: p, log: scanState && scanState.log}; $('#bScan').disabled = false; status('Échec de l\'analyse'); render(); }
  if (kind === 'sensors') onSensors(p);
  if (kind === 'duProgress') duOnProgress(p);
  if (kind === 'duDone') { DU.running = false; DU.result = p; DU.dir = p.view; DU.prog = null; lkNote('disk', `Analyse de l'espace disque : ${p.root} (${duSize(p.size)})`); status(`Espace disque : ${p.root} analysé, ${duSize(p.size)} en ${Math.round(p.seconds)} s`); renderTree(); if (view === 'disk-usage') render(); }
  if (kind === 'evDone') { EV.running = false; EV.res = p; EV.err = ''; EV.teach = ''; EV.open.clear(); const [vt] = evVerdict(p); status(`Observateur d'événements : ${vt.charAt(0).toLowerCase() + vt.slice(1)} (${p.total} événements en ${p.seconds} s)`); if (!EV.noted) { EV.noted = true; evNoteAll(true); } renderTree(); if (view === 'events') render(); }
  if (kind === 'evError') { EV.running = false; EV.err = p; status(p); renderTree(); if (view === 'events') render(); }
  if (kind === 'duError') { DU.running = false; DU.err = p; status(p); renderTree(); if (view === 'disk-usage') render(); }
  if (kind === 'battPoint') { BT.now = p; BT.points.push(p); if (view === 'battery-test') { render(); drawBattChart(); } }
  if (kind === 'battTick') { BT.elapsed = p.elapsed; BT.target = p.target; status(`Test de batterie : ${Math.floor(p.elapsed/60)}:${String(p.elapsed%60).padStart(2,'0')} / ${BT.dur}:00`); if (view === 'battery-test' && !$('#btChart')) render(); else { const bar = document.querySelector('#content .progress i'); if (bar) bar.style.width = Math.min(100, Math.round(100 * p.elapsed / (p.target || 1))) + '%'; } }
  if (kind === 'battError') { BT.running = false; BT.error = p; status(p); renderTree(); if (view === 'battery-test') render(); }
  if (kind === 'battDone') { BT.running = false; BT.paused = false; BT.result = {...analyzeBatt(), seconds: p.seconds, stopped: p.stopped}; lkBattery(BT.result); status('Test de batterie terminé' + (p.stopped ? ' (arrêté)' : '')); renderTree(); if (view === 'battery-test') render(); }
  if (kind === 'actionStep') { run.step = `Étape ${p.index + 1}/${p.count} — ${p.label}`; const el = $('#runStep'); if (el) el.textContent = run.step; status('Réparation : ' + run.step); }
  if (kind === 'actionLog') appendLog(p.id, p.line, p.replace);
  if (kind === 'actionDone') { const a = ACTIONS.find(x => x.id === p.id) || {title:p.id}; run.result[p.id] = p; run.id = null; done.push({id:p.id, title:a.title, ok:p.ok, at:new Date().toISOString()});
    appendLog(p.id, p.ok ? `— Terminé en ${p.seconds} s.${p.reboot ? ' Redémarrez le PC pour finaliser.' : ''}` : '— Interrompu.', false);
    if (p.ok && p.reboot && !QUEUE.active) rebootSuggested = true;
    if (!QUEUE.active) lkNote('repair', `Réparation « ${a.title} » : ${p.ok ? 'terminée' : 'échec ou annulée'}`, [p.ok && p.seconds ? `Durée : ${p.seconds} s.` : '', p.ok && p.reboot ? 'Un redémarrage est nécessaire pour la finaliser.' : '']);
    status(`${a.title} : ${p.ok ? 'terminé' : 'échec ou annulé'}`); renderTree(); if (view === 'repair') render();
    if (QUEUE.active) queueOnDone(p); }
};
// ----- relevé des capteurs : enregistré dès le lancement, envoyé au site au format
// d'un relevé de surveillance HWiNFO, que le Diag Atelier affiche en courbes.
const LOG_MAX = 4 * 3600; // 4 h à une mesure par seconde, les plus anciennes sont oubliées
const LOG_COLS = [ // [colonne du Diag Atelier, en-tête HWiNFO, valeur depuis les capteurs de la seconde]
  ['ramUsedPct', 'Physical Memory Load [%]', v => v.id.ram],
  ['ramUsedMo', 'Physical Memory Used [MB]', v => has(v.id.ramUsed) ? Math.round(v.id.ramUsed * 1024) : null],
  ['ramAvailMo', 'Physical Memory Available [MB]', v => has(v.id.ramFree) ? Math.round(v.id.ramFree * 1024) : null],
  ['swapPct', 'Page File Usage [%]', v => v.id.pagef],
  ['cpuPct', 'Total CPU Usage [%]', v => v.id.cpu],
  ['cpuClock', 'Core Clocks (avg) [MHz]', v => v.id.cpuf],
  ['cpuTempAvg', 'Core Temperatures (avg) [°C]', v => v.k.cpuTempAvg],
  ['cpuTempMax', 'Core Max [°C]', v => v.k.cpuTempMax],
  ['cpuPower', 'CPU Package Power [W]', v => v.k.cpuPower],
  ['diskActivity', 'Total Activity [%]', v => v.id.disk],
  ['diskTemp', 'Drive Temperature [°C]', v => v.k.diskTemp],
  ['battCharge', 'Charge Level [%]', v => v.id.bat],
  ['gpuTemp', 'GPU Temperature [°C]', v => v.k.gpuTemp],
  ['gpuLoad', 'GPU Core Load [%]', v => has(v.k.gpuLoad) ? v.k.gpuLoad : v.id.gpu],
  ['gpuPower', 'GPU Power [W]', v => v.k.gpuPower],
  ['throttleCore', 'Core Thermal Throttling (avg) [Yes/No]', v => has(v.k.throttleCore) ? (v.k.throttleCore > 0 ? 'Yes' : 'No') : null],
  ['throttlePkg', 'Package/Ring Thermal Throttling [Yes/No]', v => has(v.k.throttlePkg) ? (v.k.throttlePkg > 0 ? 'Yes' : 'No') : null],
];
const SLOG = {start: Date.now(), rows: [], send: true};
function logSensors(list){
  const v = {id: {}, k: {}};
  list.forEach(x => { v.id[x.id] = x.v; if (x.k && !has(v.k[x.k])) v.k[x.k] = x.v; }); // première source par colonne (pilote de la carte, puis HWiNFO)
  if (!has(v.k.cpuTempAvg) && has(v.k.cpuTempMax)) v.k.cpuTempAvg = v.k.cpuTempMax; // AMD : une seule sonde (Tctl/Tdie)
  SLOG.rows.push([Date.now(), LOG_COLS.map(c => { const x = c[2](v); return has(x) ? x : null; })]);
  if (SLOG.rows.length > LOG_MAX) SLOG.rows.shift();
}
const logMinutes = () => SLOG.rows.length ? Math.max(1, Math.round((SLOG.rows[SLOG.rows.length - 1][0] - SLOG.rows[0][0]) / 60000)) : 0;
const logHasTemps = () => ['cpuTempMax', 'cpuTempAvg', 'gpuTemp'].some(k => { const i = LOG_COLS.findIndex(c => c[0] === k); return SLOG.rows.some(r => r[1][i] !== null); });
function sensorLogCSV(){
  if (SLOG.rows.length < 2) return null;
  const used = LOG_COLS.map((c, i) => SLOG.rows.some(r => r[1][i] !== null));
  const q = t => '"' + String(t).replace(/"/g, '""') + '"';
  const p2 = n => String(n).padStart(2, '0');
  const lines = ['Date,Time,' + LOG_COLS.filter((c, i) => used[i]).map(c => q(c[1])).join(',')];
  SLOG.rows.forEach(([t, vals]) => { const d = new Date(t);
    lines.push(`${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()},${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')},` +
      vals.filter((x, i) => used[i]).map(x => x === null ? '' : typeof x === 'number' ? String(Math.round(x * 100) / 100) : x).join(',')); });
  return lines.join('\r\n') + '\r\n';
}
const sensorLogName = () => { const d = new Date(SLOG.rows.length ? SLOG.rows[0][0] : Date.now()), p2 = n => String(n).padStart(2, '0');
  return `Releve_${(D && D.meta && D.meta.computer) || 'PC'}_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.csv`; };
function resetSensorLog(){ SLOG.rows = []; SLOG.start = Date.now(); }

function onSensors(list){
  logSensors(list);
  list.forEach(x => { let s = S[x.id];
    if (!s) { s = S[x.id] = {g:x.g, l:x.l, u:x.u, v:x.v, min:x.v, max:x.v, sum:0, n:0, h:[]}; sensOrder.push(x.id); if (view === 'sensors') setTimeout(renderSensorTable, 0); }
    s.v = x.v; s.min = Math.min(s.min, x.v); s.max = Math.max(s.max, x.v); s.sum += x.v; s.n++; s.h.push(x.v); if (s.h.length > 120) s.h.shift(); });
  const G = ['Processeur','Mémoire','Disques','Réseau','Carte graphique','Températures','Batterie','Système'];
  const gi = g => { const i = G.indexOf(g); return i >= 0 ? i : g.startsWith('Carte graphique') ? G.indexOf('Carte graphique') + .5 : G.length; };
  sensOrder.sort((a, b) => (gi(S[a].g) - gi(S[b].g)) || (S[a].g < S[b].g ? -1 : S[a].g > S[b].g ? 1 : 0));
  const f = (id, u) => S[id] ? fmtV(S[id].v, u) : '—';
  $('#sbCpu').textContent = f('cpu','%'); $('#sbRam').textContent = f('ram','%'); $('#sbDisk').textContent = f('disk','%');
  $('#sbNet').textContent = S.netR ? fmtV(S.netR.v + (S.netS ? S.netS.v : 0), 'Mbit/s') : '—';
  const t = Object.values(S).filter(s => s.g === 'Températures'); if (t.length) { $('#sbTempWrap').hidden = false; $('#sbTemp').textContent = fmtV(Math.max(...t.map(s => s.v)), '°C'); }
  if (view === 'sensors') { drawSensors(); const n = $('#logN'), d = $('#logDur'); if (n) n.textContent = SLOG.rows.length; if (d) d.textContent = logMinutes() + ' min'; }
  if (view === 'summary') drawMini();
  ['cpu','cpuf','bat'].forEach(id => { const el = document.getElementById('pv-' + id); if (el && S[id]) el.textContent = fmtV(S[id].v, S[id].u); });
}

// ===================== démarrage =====================
function startScan(){ if (scanState && scanState.running) return; $('#bScan').disabled = true; scanState = {running:true, step:0, total:14, label:'Démarrage de la collecte…'}; status('Analyse en cours…'); api.scan(); if (view !== 'summary') go('summary'); else render(); }
$('#bScan').addEventListener('click', startScan);
(async () => {
  info = await api.info(); $('#pcName').textContent = info.computer; if (info.version) { document.title = 'Planete-Computers 2.0 · PC2 Diag ' + info.version; $('#sbVer b').textContent = 'v' + info.version; }
  const pill = $('#adminPill'); if (!info.admin) { pill.textContent = 'Mode limité'; pill.classList.add('limited'); pill.title = 'Sans droits administrateur : diagnostic partiel'; }
  try { ACTIONS = await api.actions(); } catch (_) {}
  try { CFG = await api.cfg() || {}; } catch (_) {}
  // nom du magasin : « Planete-Computers 2.0 », aussi pour les en-têtes enregistrés avec l'ancien nom
  if (!CFG.shop || /^plan[eèé]te[\s-]*computers(\s*2\.0)?$/i.test(CFG.shop.trim())) CFG.shop = 'Planete-Computers 2.0';
  try { SITE.state = await sapi.state(); } catch (_) {}
  sbWho();
  await lkRestore();
  await refreshHist();
  if (info.resumed) status('Reprise automatique après le redémarrage — nouvelle analyse en cours pour le comparatif avant/après.');
  renderTree(); render(); api.sensors(); startScan();
})();
window.addEventListener('resize', () => { if (view === 'disk-usage' && DU.tab === 'map') duDrawMap(); if (view === 'sensors') drawSensors(); if (view === 'summary') drawMini(); });
</script>
