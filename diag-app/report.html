<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC2 Diag</title>
<style>
/* Layout : fiche d'intervention — en-tête machine, verdict, onglets (Problèmes / Matériel / Logiciel / Contrôles OK), cartes de constats avec bande de gravité */
:root{
  --bg:#f2f4f5; --panel:#fff; --fg:#16202a; --muted:#5a6773; --line:#d8dfe4; --accent:#0f6b73; --soft:#e8eef0;
  --crit:#b42318; --crit-bg:#fde8e6; --warn:#a15c00; --warn-bg:#fdf1dc; --info:#2459a6; --info-bg:#e5eefb; --ok:#1d7a46; --ok-bg:#e2f4ea;
  --f-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161b; --panel:#172029; --fg:#e3e9ee; --muted:#93a1ad; --line:#293642; --accent:#4fb8c0; --soft:#1e2a34;
  --crit:#ff8a7f; --crit-bg:#3a1c1a; --warn:#f2b45c; --warn-bg:#382a14; --info:#8db6f5; --info-bg:#1a2a42; --ok:#6fd39b; --ok-bg:#163126; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 1.9rem/1.15 var(--f-display);margin:2px 0 0;letter-spacing:-.01em}
.head .model{color:var(--muted)}
.stamp{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right}
.verdict{border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.verdict strong{font-size:1.05rem}
.verdict.crit{background:var(--crit-bg);color:var(--crit)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.ok{background:var(--ok-bg);color:var(--ok)}
.tally{display:flex;gap:16px;font-family:var(--f-mono);font-size:.85rem}
.notice{background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 14px;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:600 .92rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tab:focus-visible,.chip:focus-visible,.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab .n{font-family:var(--f-mono);font-size:.8rem;margin-left:6px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .8rem var(--f-body);border-radius:999px;padding:5px 12px;background:var(--panel);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:8px;padding:14px 16px;display:grid;gap:7px;min-width:0}
.item.crit{--sev:var(--crit)} .item.warn{--sev:var(--warn)} .item.info{--sev:var(--info)}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.badge{font:700 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--sev)}
.cat{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.item h3{margin:0;font-size:1.02rem;flex:1 1 300px;min-width:0}
.where{font-size:.85rem;color:var(--muted)}
code,.mono{font-family:var(--f-mono);font-size:.82rem}
.where code{background:var(--soft);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.fix{font-size:.93rem;max-width:80ch}
.fix b.l{color:var(--accent)}
.fix ol,.fix ul{margin:4px 0 0;padding-left:20px}
.cmd{display:flex;gap:8px;align-items:stretch;min-width:0}
.cmd pre{margin:0;flex:1;min-width:0;background:var(--soft);border-radius:6px;padding:8px 10px;overflow-x:auto;font:.82rem var(--f-mono)}
.copy{font:600 .78rem var(--f-body);border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:0 10px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font:600 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:3px 12px;margin:0;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sub{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent)} .bar i.w{background:var(--warn)} .bar i.c{background:var(--crit)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.search{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:100%;max-width:360px}
.oklist{columns:2 300px;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0;list-style:none}
.oklist li{break-inside:avoid;padding:4px 0 4px 22px;position:relative;font-size:.9rem}
.oklist li::before{content:"";position:absolute;left:2px;top:.65em;width:10px;height:6px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.oklist li span{color:var(--muted)}
footer{color:var(--muted);font-size:.8rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--accent)}
.bhead .shop{font:700 1.35rem/1.2 var(--f-display);color:var(--accent)}
.bhead .coord{color:var(--muted);font-size:.88rem;white-space:pre-line}
.bhead .rt{text-align:right;font-size:.9rem}
.bhead .rt b{font-size:1rem}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;white-space:pre-wrap}
.notes h2,.ptitle{font:600 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.ptitle{display:none;margin-top:18px}
.done li{margin:2px 0}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .tabs,.chips,.copy,.search,footer{display:none!important}
  #p-pb,#p-hw,#p-ok,#p-pb[hidden],#p-hw[hidden],#p-ok[hidden]{display:block!important}
  #p-sw,#p-sw[hidden]{display:none!important}
  .ptitle{display:block}
  .item,.card,.notes{break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="brand"></div>
  <div class="head">
    <div>
      <div class="eyebrow">Rapport de diagnostic</div>
      <h1 id="pcname">—</h1>
      <div class="model" id="pcmodel"></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="verdict" id="verdict"></div>
  <div class="notice" id="adminNote" hidden>Analyse lancée sans droits administrateur : l'état SMART des disques, BitLocker, DISM et une partie des journaux n'ont pas pu être lus. Relancez l'outil et acceptez l'élévation pour un diagnostic complet.</div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-pb" data-t="pb" aria-selected="true">Problèmes<span class="n" id="n-pb"></span></button>
    <button class="tab" role="tab" id="t-hw" data-t="hw" aria-selected="false">Matériel</button>
    <button class="tab" role="tab" id="t-sw" data-t="sw" aria-selected="false">Logiciel</button>
    <button class="tab" role="tab" id="t-ok" data-t="ok" aria-selected="false">Contrôles réussis<span class="n" id="n-ok"></span></button>
  </div>

  <section id="p-pb" class="list-wrap" style="display:flex;flex-direction:column;gap:12px">
    <h2 class="ptitle">Problèmes détectés</h2>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>
  <section id="p-hw" hidden><h2 class="ptitle">Inventaire matériel</h2><div class="grid" id="hw"></div></section>
  <section id="p-sw" hidden style="display:flex;flex-direction:column;gap:12px"></section>
  <section id="p-ok" hidden><h2 class="ptitle">Contrôles réussis</h2><ul class="oklist" id="oklist"></ul></section>

  <footer id="foot"></footer>
</div>

<script>
const D = __DATA__;
const BRAND = __BRAND__;

// ---------- utilitaires ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr = v => v == null ? [] : (Array.isArray(v) ? v : [v]);
const days = iso => iso ? (Date.now() - new Date(iso)) / 864e5 : null;
const fdate = iso => iso ? new Date(iso).toLocaleDateString('fr-FR') : '—';
const fdt = iso => iso ? new Date(iso).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}) : '—';
const has = v => v !== null && v !== undefined && v !== '';

// ---------- règles ----------
const F = [], OK = [];
const add = (sev, cat, title, where, fix, cmd) => F.push({sev, cat, title, where, fix, cmd});
const ok = (cat, text) => OK.push({cat, text});

const CM = {1:'mal configuré',3:'pilote corrompu ou mémoire insuffisante',10:'ne peut pas démarrer',12:'ressources insuffisantes',14:'redémarrage requis',18:'pilotes à réinstaller',19:'registre corrompu',21:'en cours de suppression',22:'désactivé',24:'absent ou mal installé',28:'pilote non installé',29:'désactivé dans le BIOS',31:'pilote ne se charge pas',32:'service du pilote désactivé',37:'échec d\'initialisation du pilote',39:'pilote corrompu ou absent',41:'matériel non détecté',43:'arrêté après avoir signalé un problème',48:'pilote bloqué (incompatible)',52:'pilote non signé'};
const BSOD = {'0x00000124':'WHEA_UNCORRECTABLE_ERROR — erreur matérielle (CPU, RAM, alimentation, surchauffe)','0x0000001a':'MEMORY_MANAGEMENT — souvent la RAM','0x00000050':'PAGE_FAULT_IN_NONPAGED_AREA — RAM ou pilote','0x0000003b':'SYSTEM_SERVICE_EXCEPTION — pilote','0x000000d1':'DRIVER_IRQL_NOT_LESS_OR_EQUAL — pilote (réseau souvent)','0x0000000a':'IRQL_NOT_LESS_OR_EQUAL — pilote ou RAM','0x0000007e':'SYSTEM_THREAD_EXCEPTION_NOT_HANDLED — pilote','0x000000ef':'CRITICAL_PROCESS_DIED — fichiers système ou disque','0x00000133':'DPC_WATCHDOG_VIOLATION — pilote de stockage ou firmware SSD','0x0000009f':'DRIVER_POWER_STATE_FAILURE — pilote et mise en veille','0x00000116':'VIDEO_TDR_FAILURE — pilote graphique','0x00000139':'KERNEL_SECURITY_CHECK_FAILURE — pilote ou RAM','0x0000007a':'KERNEL_DATA_INPAGE_ERROR — disque ou câble'};
const bsodName = c => { if (!c) return ''; let h = c; if (/^\d+$/.test(c)) h = '0x' + (+c).toString(16).padStart(8,'0'); h = h.toLowerCase(); return BSOD[h] || h; };

function rules(D){
  const m = D.meta || {};
  // ---- Stockage
  arr(D.disks).forEach(d => {
    const w = `${d.name} (${d.bus || '?'}, ${d.sizeGB} Go)`;
    if (d.health && !/healthy|sain/i.test(d.health)) add(/unhealthy/i.test(d.health)||/predict|fail/i.test(d.op||'')?'crit':'warn','Stockage',`Disque en état « ${d.health} »`,w,
      `Windows considère ce disque comme défaillant (état opérationnel : ${esc(d.op)}).<ol><li><b>Sauvegardez immédiatement</b> les données.</li><li>Vérifiez avec l'outil du fabricant ou CrystalDiskInfo.</li><li>Remplacez le disque.</li></ol>`);
    else if (d.health) ok('Stockage', `${d.name} : état Windows « sain »`);
    if (has(d.wear)) { if (d.wear >= 90) add('crit','Stockage',`SSD usé à ${d.wear} %`,w,'Le SSD arrive en fin d\'endurance. Sauvegarde et remplacement rapides.');
      else if (d.wear >= 70) add('warn','Stockage',`SSD usé à ${d.wear} %`,w,'Usure avancée. Prévoir le remplacement dans les prochains mois.');
      else ok('Stockage', `${d.name} : usure ${d.wear} %`); }
    if (has(d.readErr) && d.readErr > 0) add('crit','Stockage',`${d.readErr} erreur(s) de lecture non corrigée(s)`,w,'Le disque n\'arrive plus à relire certaines données. Sauvegarde puis test long constructeur ; remplacement si les erreurs augmentent.');
    if (has(d.writeErr) && d.writeErr > 0) add('crit','Stockage',`${d.writeErr} erreur(s) d'écriture non corrigée(s)`,w,'Sauvegarde puis remplacement du disque.');
    if (has(d.temp) && d.temp >= 65) add('warn','Stockage',`Disque à ${d.temp} °C`,w,'Température élevée : vérifier la ventilation, nettoyer la poussière, ajouter un dissipateur au SSD M.2.');
    if (/HDD/i.test(d.media) && /^C|SATA/.test(d.bus||'') ) {}
  });
  if (arr(D.smartPredict).length) add('crit','Stockage','Le disque annonce une panne imminente (SMART)', arr(D.smartPredict).join(', '),
    '<b>Sauvegardez maintenant</b> puis remplacez le disque : l\'auto-diagnostic SMART prédit une défaillance.');
  const sysHdd = arr(D.disks).find(d => /HDD/i.test(d.media) && !/USB/i.test(d.bus));
  if (sysHdd) add('info','Performance','Disque dur mécanique détecté',`${sysHdd.name}`,'Si Windows est installé dessus, le passage à un SSD est l\'amélioration la plus visible (démarrage et ouverture des logiciels 3 à 5 fois plus rapides).');

  arr(D.volumes).forEach(v => {
    const w = `Lecteur ${v.letter}${v.label ? ' « ' + v.label + ' »' : ''} — ${v.freeGB} Go libres sur ${v.sizeGB} Go`;
    if (has(v.freePct)) {
      if (v.freePct < 10 || v.freeGB < 10) add('crit','Stockage',`Lecteur ${v.letter} presque plein (${v.freePct} % libre)`,w,
        'Windows ralentit et les mises à jour échouent sous ~10 % libre.<ol><li>Nettoyage de disque avec « Nettoyer les fichiers système ».</li><li>Paramètres › Système › Stockage › Fichiers temporaires.</li><li>Déplacer photos/vidéos vers un autre support.</li></ol>','cleanmgr /sageset:1 & cleanmgr /sagerun:1');
      else if (v.freePct < 20) add('warn','Stockage',`Lecteur ${v.letter} à ${100-v.freePct} % plein`,w,'Prévoir un nettoyage ou un disque plus grand.','cleanmgr /d ' + v.letter);
      else ok('Stockage', `Lecteur ${v.letter} : ${v.freePct} % libre`);
    }
    if (v.dirty) add('warn','Stockage',`Système de fichiers ${v.letter} marqué comme incohérent`,w,'Windows a détecté des erreurs NTFS. Planifier une vérification au prochain redémarrage.','chkdsk ' + v.letter + ' /f');
    if (v.letter === 'C:' && D.meta.isAdmin) {
      if (/on|1/i.test(String(v.bitlocker))) ok('Sécurité','C: chiffré par BitLocker');
      else if (has(v.bitlocker) && m.edition && !/core|home/i.test(m.edition)) add('info','Sécurité','Disque système non chiffré (BitLocker désactivé)',w,'En cas de vol du portable, les données sont lisibles. Activer BitLocker et conserver la clé de récupération (compte Microsoft ou impression).');
    }
  });
  if (D.junkGB >= 5) add('info','Stockage',`${D.junkGB} Go de fichiers temporaires`,'%TEMP%, C:\\Windows\\Temp, cache Windows Update','Espace récupérable sans risque.','cleanmgr /sageset:1 & cleanmgr /sagerun:1');

  // ---- Batterie
  const b = D.battery || {};
  if (b.present) {
    if (has(b.wearPct)) { if (b.wearPct >= 40) add('crit','Matériel',`Batterie usée à ${b.wearPct} %`,`${b.name} — ${b.cycles ?? '?'} cycles`,'Autonomie fortement réduite : remplacement de la batterie conseillé.');
      else if (b.wearPct >= 20) add('warn','Matériel',`Batterie usée à ${b.wearPct} %`,`${b.name} — ${b.cycles ?? '?'} cycles`,'Usure normale avec l\'âge. Activer la limite de charge à 80 % dans l\'utilitaire du constructeur (Lenovo Vantage, MyASUS, Dell Power Manager…) pour la ralentir.');
      else ok('Matériel', `Batterie : ${b.wearPct} % d'usure, ${b.cycles ?? '?'} cycles`); }
  }

  // ---- Périphériques
  const devs = arr(D.devices);
  devs.forEach(d => {
    const sev = d.code === 22 ? 'info' : (d.code === 28 ? 'warn' : 'warn');
    add(sev,'Pilotes',`${d.name} : ${CM[d.code] || 'erreur code ' + d.code}`,`Classe ${d.cls || '?'} — code ${d.code} — ${d.id}`,
      d.code === 22 ? 'Périphérique désactivé volontairement. Le réactiver dans le Gestionnaire de périphériques s\'il doit servir.' :
      d.code === 28 || d.code === 18 ? 'Installer le pilote : Windows Update (Paramètres › Windows Update › Options avancées › Mises à jour facultatives) ou site du constructeur, en cherchant l\'ID matériel ci-dessus.' :
      d.code === 43 ? 'Débrancher/rebrancher, mettre à jour le pilote et le BIOS. Si le code revient, le composant (ou son port) est suspect.' :
      'Gestionnaire de périphériques › clic droit › Désinstaller le périphérique, puis « Rechercher les modifications sur le matériel ». Mettre à jour le pilote depuis le site du constructeur.', 'devmgmt.msc');
  });
  if (!devs.length) ok('Pilotes','Aucun périphérique en erreur dans le Gestionnaire de périphériques');
  arr(D.gpu).forEach(g => { const a = days(g.driverDate);
    if (a && a > 730 && !/basic|microsoft/i.test(g.name)) add('info','Pilotes',`Pilote graphique daté de ${new Date(g.driverDate).getFullYear()}`,`${g.name} — ${g.driver}`,'Mettre à jour depuis le site Intel / AMD / NVIDIA ou du constructeur du PC.');
    if (/basic display|vga standard|de base/i.test(g.name)) add('warn','Pilotes','Carte graphique sans pilote (affichage de base)',g.name,'Installer le pilote graphique du constructeur : affichage lent, résolution limitée et pas d\'accélération sinon.'); });

  // ---- Stabilité
  const e = D.events || {};
  const bs = arr(e.bsod);
  if (bs.length) { const codes = [...new Set(bs.map(x => bsodName(x.code)))].filter(Boolean);
    add(bs.length >= 3 ? 'crit' : 'warn','Stabilité',`${bs.length} écran(s) bleu(s) sur 30 jours`, `Dernier : ${fdt(bs[0].date)}${D.events.dumps && D.events.dumps.count ? ' — ' + D.events.dumps.count + ' fichier(s) minidump' : ''}`,
      `Codes relevés :<ul>${codes.map(c => '<li><code>' + esc(c) + '</code></li>').join('')}</ul>Analyser C:\\Windows\\Minidump avec WinDbg ou BlueScreenView pour identifier le pilote en cause. Mettre à jour BIOS et pilotes, puis tester la RAM.`, 'mdsched.exe'); }
  else ok('Stabilité','Aucun écran bleu sur 30 jours');
  if (e.kernelPower41 > 0) add(e.kernelPower41 >= 3 ? 'warn' : 'info','Stabilité',`${e.kernelPower41} redémarrage(s) / arrêt(s) brutal(aux)`,'Journal Système — Kernel-Power 41',
    'Le PC s\'est éteint sans arrêt propre : coupure de courant, appui long sur le bouton, batterie vide, ou plantage/surchauffe. Si l\'utilisateur ne l\'explique pas : vérifier l\'alimentation, la température et les écrans bleus.');
  else ok('Stabilité','Aucun arrêt brutal sur 30 jours');
  if (e.whea > 0) add(e.whea >= 10 ? 'crit' : 'warn','Matériel',`${e.whea} erreur(s) matérielle(s) WHEA`,'Journal Système — WHEA-Logger',
    `Erreurs signalées directement par le processeur, la RAM ou le bus PCIe.${arr(e.wheaSample).length ? '<br>Exemple : <code>' + esc(arr(e.wheaSample)[0]) + '</code>' : ''}<ol><li>Mettre à jour BIOS et chipset.</li><li>Annuler tout overclocking / profil XMP-EXPO.</li><li>Tester la RAM (Diagnostic mémoire Windows ou MemTest86).</li><li>Si « PCI Express » : reseater la carte/SSD concerné, désactiver l'ASPM dans le BIOS.</li></ol>`, 'mdsched.exe');
  else ok('Matériel','Aucune erreur matérielle WHEA');
  const de = (e.disk || 0) + (e.ntfs || 0) + (e.storReset || 0);
  if (de > 0) add(de >= 5 ? 'crit' : 'warn','Stockage',`${de} erreur(s) disque dans le journal`,`disque : ${e.disk || 0} · NTFS : ${e.ntfs || 0} · réinitialisations contrôleur : ${e.storReset || 0}`,
    'Secteurs défectueux, câble ou contrôleur instable.<ol><li>Sauvegarder.</li><li>Lancer un test SMART long et <code>chkdsk C: /r</code>.</li><li>Pour un SSD NVMe : mettre à jour son firmware et le pilote de stockage (Intel RST / AMD).</li></ol>','chkdsk C: /scan');
  else ok('Stockage','Aucune erreur disque ou NTFS dans le journal');
  if (e.memDiag && e.memDiag.id === 1101) add('crit','Matériel','Le dernier diagnostic mémoire a trouvé des erreurs',fdt(e.memDiag.date),'Une ou plusieurs barrettes de RAM sont défectueuses. Tester barrette par barrette (MemTest86) et remplacer la défaillante.');

  // ---- Sécurité
  const s = D.security || {};

  const def = s.defender;

  else if (s.uac === 1) ok('Sécurité','Contrôle de compte utilisateur actif');

    <div class="sub">${kv([['Adresses IP',arr(n.ip).map(esc).join('<br>')],['Passerelle',esc(n.gateway) + (n.gwPing ? ' (répond)' : n.gwPing === false ? ' (ne répond pas)' : '')],['DNS',arr(n.dnsServers).map(esc).join(', ')],['Wi-Fi',n.wifi ? esc(n.wifi.ssid) + ' — ' + n.wifi.signal + ' %' : ''],['Internet',n.internet ? 'OK' : 'Échec']])}</div></div>`);
  if (arr(D.thermal).length || arr(D.topProcesses).length) cards.push(`<div class="card"><h2>Processus les plus gourmands (RAM)</h2><table>${arr(D.topProcesses).map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.ramMB} Mo</td></tr>`).join('')}</table>
    ${arr(D.thermal).length ? '<div class="sub"><h2>Zones thermiques ACPI</h2>' + kv(arr(D.thermal).map(t => [t.zone, t.c + ' °C'])) + '</div>' : ''}</div>`);
  document.getElementById('hw').innerHTML = cards.join('');
}
function renderSoftware(){
  const sw = arr(D.software), st = arr(D.startup), s = D.security || {};
  const p = document.getElementById('p-sw');
  p.innerHTML = `<div class="grid">
     <div class="card"><h2>Sécurité</h2>${kv([['Antivirus',arr(s.av).map(a => esc(a.name) + (a.enabled ? ' (actif)' : ' (inactif)')).join('<br>')],['Defender',s.defender ? (s.defender.rtp ? 'Protection temps réel active' : 'Temps réel inactif') + ` · définitions ${s.defender.sigAge} j` : ''],['Pare-feu',arr(s.firewall).map(f => esc(f.profile) + ' ' + (f.enabled ? 'actif' : 'INACTIF')).join(' · ')],['Secure Boot',s.secureBoot === true ? 'Actif' : s.secureBoot === false ? 'Désactivé' : ''],['TPM',s.tpm ? (s.tpm.present ? 'Présent' : 'Absent') : ''],['Administrateurs',arr(s.admins).map(esc).join(', ')]])}</div>
     <div class="card"><h2>Démarrage (${st.length})</h2><table>${st.map(x => `<tr><td>${esc(x.name)}</td><td class="mono" style="font-size:.75rem;overflow-wrap:anywhere">${esc(x.cmd)}</td></tr>`).join('')}</table></div>
   </div>
   <input class="search" id="swq" type="search" placeholder="Filtrer les ${sw.length} logiciels installés…" aria-label="Filtrer les logiciels">
   <div class="tbl"><table><thead><tr><th>Logiciel</th><th>Version</th><th>Éditeur</th><th>Installé</th></tr></thead><tbody id="swb"></tbody></table></div>`;
  const draw = q => { q = (q || '').toLowerCase(); document.getElementById('swb').innerHTML = sw.filter(x => !q || (x.name + ' ' + x.publisher).toLowerCase().includes(q)).map(x =>
    `<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.version)}</td><td>${esc(x.publisher)}</td><td class="mono">${x.date && /^\d{8}$/.test(x.date) ? x.date.slice(6,8) + '/' + x.date.slice(4,6) + '/' + x.date.slice(0,4) : ''}</td></tr>`).join(''); };
  draw(); document.getElementById('swq').addEventListener('input', e => draw(e.target.value));
}
function renderOk(){ document.getElementById('oklist').innerHTML = OK.map(o => `<li>${esc(o.text)} <span>· ${esc(o.cat)}</span></li>`).join(''); }

// ---------- démarrage ----------
const m = D.meta || {};
document.title = 'Diagnostic ' + (m.computer || 'PC');
document.getElementById('pcname').textContent = m.computer || 'PC';
document.getElementById('pcmodel').textContent = [m.manufacturer, m.model, '—', m.os, m.displayVersion].filter(Boolean).join(' ');
document.getElementById('stamp').innerHTML = `Analyse du ${fdt(m.scanDate)}<br>Durée ${m.duration ?? '?'} s · ${m.isAdmin ? 'mode administrateur' : 'mode limité'}`;
document.getElementById('foot').textContent = 'Rapport généré localement en lecture seule : aucune modification n\'a été faite sur le poste et aucune donnée n\'a été envoyée.';

if (BRAND && (BRAND.shop || BRAND.client)) {
  const coord = [BRAND.address, BRAND.phone, BRAND.email].filter(Boolean).join('\n');
  let h = `<div class="bhead"><div><div class="shop">${esc(BRAND.shop || '')}</div><div class="coord">${esc(coord)}</div></div>
    <div class="rt"><b>Rapport de diagnostic informatique</b><br>${BRAND.client ? 'Client : ' + esc(BRAND.client) + '<br>' : ''}${BRAND.tech ? 'Technicien : ' + esc(BRAND.tech) + '<br>' : ''}Le ${new Date().toLocaleDateString('fr-FR')}</div></div>`;
  if (BRAND.notes) h += `<div class="notes" style="margin-top:14px"><h2>Observations du technicien</h2>${esc(BRAND.notes)}</div>`;
  const acts = (BRAND.actions || []);
  if (acts.length) h += `<div class="notes" style="margin-top:14px"><h2>Interventions réalisées</h2><ul class="done">${acts.map(a => `<li>${esc(a.title)} — ${a.ok ? 'terminé' : 'non abouti'} (${new Date(a.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})})</li>`).join('')}</ul></div>`;
  document.getElementById('brand').innerHTML = h;
  document.querySelector('.eyebrow').textContent = 'Poste analysé';
}
rules(D); renderProblems(); renderHardware(); renderSoftware(); renderOk();

document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  ['pb','hw','sw','ok'].forEach(k => document.getElementById('p-' + k).hidden = k !== t.dataset.t); });
document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.f; drawList(); });
document.getElementById('list').addEventListener('click', e => { const b = e.target.closest('.copy'); if (!b) return;
  const done = () => { b.textContent = 'Copié'; setTimeout(() => b.textContent = 'Copier', 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); done(); } catch(_) {} };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.cmd).then(done, fallback); else fallback(); });
</script>
</body>
